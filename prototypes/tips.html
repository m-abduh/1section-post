<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tips — Prototype</title>
<link rel="stylesheet" href="doodle.css">
<style>
.container { --accent: #7a9e8c; }
.label { background: rgba(122,158,140,.12); color: var(--accent); }
.tips-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  width: 100%;
  max-width: 700px;
}
.tip-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 20px;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
}
.tip-icon {
  width: 36px;
  height: 36px;
  min-width: 36px;
  border-radius: 10px;
  background: rgba(122,158,140,.1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}
.tip-title {
  font-size: 30px;
  font-weight: 700;
}
.tip-desc {
  font-size: 22px;
  color: #999;
  margin-top: 1px;
}
</style>
</head>
<body>
<div class="container">

  <div class="label-row">
    <span class="label">Tips</span>
  </div>
  <div class="visual-area" style="flex:none;flex-direction:column;width:100%;padding:10px 0;align-items:flex-start">
    <div class="tips-list">
      <div class="tip-item">
        <div class="tip-icon">🎯</div>
        <div>
          <div class="tip-title">Single-task mode</div>
          <div class="tip-desc">One focus block at a time. No multitasking allowed.</div>
        </div>
      </div>
      <div class="tip-item">
        <div class="tip-icon">⏱</div>
        <div>
          <div class="tip-title">Time boxing</div>
          <div class="tip-desc">Set a timer. Work only until it rings. Then rest.</div>
        </div>
      </div>
      <div class="tip-item">
        <div class="tip-icon">🧹</div>
        <div>
          <div class="tip-title">Environment design</div>
          <div class="tip-desc">Remove distractions before they remove your focus.</div>
        </div>
      </div>
    </div>
  </div>
  <div class="content-area" style="margin-top:auto">
    <div class="desc">
      Simple productivity hacks that actually work.
    </div>
  </div>
</div>
</body>
</html>
