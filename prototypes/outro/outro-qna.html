<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:'Satoshi';src:url('../../fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
body{font-family:'Satoshi',system-ui,sans-serif;background:#f8f7f4}
#root{width:1080px;height:1920px;display:flex;flex-direction:column;background:#f8f7f4;padding:60px 80px}
.top{display:flex;justify-content:flex-end}
.domain{font-size:13px;color:#ddd;letter-spacing:3px;text-transform:uppercase}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.icon-lg{font-size:80px;color:#6a8a8a;line-height:1;margin-bottom:20px}
.outro-title{font-size:48px;font-weight:800;line-height:1.1;letter-spacing:-2px;color:#1a1a1a;max-width:600px}
.outro-desc{font-size:22px;color:#bbb;line-height:1.45;max-width:480px;margin-top:10px}
</style>
</head>
<body>
<div id="root">
  <div class="top"><div class="domain">1section.com</div></div>
  <div class="center">
    <div class="icon-lg">?</div>
    <div class="outro-title">Stay curious</div>
    <div class="outro-desc">The best answers come from the best questions. Keep asking.</div>
  </div>
</div>
</body>
</html>
