<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:'Satoshi';src:url('../../fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
body{font-family:'Satoshi',system-ui,sans-serif;background:#f8f7f4}
#root{width:1080px;height:1920px;display:flex;flex-direction:column;background:#f8f7f4;padding:60px 80px}
.top{display:flex;justify-content:flex-end}
.domain{font-size:13px;color:#ddd;letter-spacing:3px;text-transform:uppercase}
.center{flex:1;display:flex;align-items:center;gap:40px}
.icon-sq{width:100px;height:100px;border:1.5px solid #7a8b5d;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:36px;color:#7a8b5d;flex-shrink:0}
.text{flex:1}
.outro-title{font-size:46px;font-weight:800;line-height:1.1;letter-spacing:-1.5px;color:#1a1a1a}
.outro-desc{font-size:22px;color:#bbb;line-height:1.45;margin-top:8px}
</style>
</head>
<body>
<div id="root">
  <div class="top"><div class="domain">1section.com</div></div>
  <div class="center">
    <div class="icon-sq">&#8646;</div>
    <div class="text">
      <div class="outro-title">Choose better</div>
      <div class="outro-desc">Small differences add up. Pick the right side.</div>
    </div>
  </div>
</div>
</body>
</html>
