<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:'Satoshi';src:url('../../fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
body{font-family:'Satoshi',system-ui,sans-serif;background:#f8f7f4}
#root{width:1080px;height:1920px;display:flex;flex-direction:column;background:#f8f7f4;padding:0}
.top{display:flex;justify-content:center;padding:60px 80px 0}
.top-line{width:100%;max-width:500px;height:1px;background:#e8e4de}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 80px}
.bottom-line{width:100%;max-width:500px;height:1px;background:#e8e4de;margin:0 auto 40px}
.outro-title{font-size:48px;font-weight:800;line-height:1.1;letter-spacing:-1.5px;color:#1a1a1a;max-width:580px}
.outro-desc{font-size:22px;color:#bbb;line-height:1.45;max-width:480px;margin-top:10px}
.domain{font-size:13px;color:#ddd;letter-spacing:3px;text-transform:uppercase;margin-top:auto;text-align:center;padding:0 80px 60px}
</style>
</head>
<body>
<div id="root">
  <div class="top"><div class="top-line"></div></div>
  <div class="center">
    <div class="outro-title">One step at a time</div>
    <div class="outro-desc">Small steps lead to big places. Keep moving.</div>
  </div>
  <div class="bottom-line"></div>
  <div class="domain">1section.com</div>
</div>
</body>
</html>
