<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:'Satoshi';src:url('../../fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
body{font-family:'Satoshi',system-ui,sans-serif;background:#f8f7f4}
#root{width:1080px;height:1920px;display:flex;align-items:center;background:#f8f7f4;padding:80px}
.row{display:flex;align-items:center;gap:36px;width:100%}
.icon-left{display:flex;flex-direction:column;align-items:center;gap:10px}
.icon-rc{width:80px;height:80px;border:1.5px solid #b08a5c;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#b08a5c}
.v-line{width:1px;height:100px;background:#e8e4de}
.text-right{flex:1}
.outro-title{font-size:44px;font-weight:800;line-height:1.1;letter-spacing:-1.5px;color:#1a1a1a}
.outro-desc{font-size:22px;color:#bbb;line-height:1.45;margin-top:8px;max-width:440px}
.domain{font-size:13px;color:#ddd;letter-spacing:3px;text-transform:uppercase;margin-top:20px}
</style>
</head>
<body>
<div id="root">
  <div class="row">
    <div class="icon-left">
      <div class="icon-rc">&#8730;</div>
      <div class="v-line"></div>
    </div>
    <div class="text-right">
      <div class="outro-title">Know the truth</div>
      <div class="outro-desc">Don't believe everything you think. Facts first.</div>
      <div class="domain">1section.com</div>
    </div>
  </div>
</div>
</body>
</html>
