<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:'Satoshi';src:url('../../fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
body{font-family:'Satoshi',system-ui,sans-serif;background:#f8f7f4}
#root{width:1080px;height:1920px;display:flex;flex-direction:column;background:#f8f7f4;padding:0}
.bar{height:8px;background:linear-gradient(90deg,#d4745d,#e8957e)}
.content{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:60px 80px}
.outro-title{font-size:50px;font-weight:800;line-height:1.1;letter-spacing:-2px;color:#1a1a1a;max-width:620px}
.outro-desc{font-size:24px;color:#bbb;line-height:1.45;max-width:500px;margin-top:12px}
.domain{font-size:13px;color:#ddd;letter-spacing:3px;text-transform:uppercase;margin-top:28px}
</style>
</head>
<body>
<div id="root">
  <div class="bar"></div>
  <div class="content">
    <div class="outro-title">The number matters</div>
    <div class="outro-desc">But what you do with it matters more.</div>
    <div class="domain">1section.com</div>
  </div>
</div>
</body>
</html>
