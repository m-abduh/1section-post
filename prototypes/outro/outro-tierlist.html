<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:'Satoshi';src:url('../../fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
body{font-family:'Satoshi',system-ui,sans-serif;background:#f8f7f4}
#root{width:1080px;height:1920px;display:flex;flex-direction:column;background:#f8f7f4;padding:60px 80px}
.domain{font-size:13px;color:#ddd;letter-spacing:3px;text-transform:uppercase;text-align:right}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.icon-star{font-size:70px;color:#8a7a5a;line-height:1;margin-bottom:20px}
.outro-title{font-size:46px;font-weight:800;line-height:1.1;letter-spacing:-1.5px;color:#1a1a1a;max-width:580px}
.outro-desc{font-size:22px;color:#bbb;line-height:1.45;max-width:460px;margin-top:10px}
.lines{display:flex;align-items:center;gap:14px;margin-top:24px}
.lines .ln{width:30px;height:1px;background:#e8e4de}
</style>
</head>
<body>
<div id="root">
  <div class="domain">1section.com</div>
  <div class="center">
    <div class="icon-star">&#9733;</div>
    <div class="outro-title">Know your tiers</div>
    <div class="outro-desc">Not everything belongs in S-tier. Choose wisely.</div>
    <div class="lines"><div class="ln"></div><div class="ln"></div></div>
  </div>
</div>
</body>
</html>
