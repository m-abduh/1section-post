<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:'Satoshi';src:url('../../fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
body{font-family:'Satoshi',system-ui,sans-serif;background:#f8f7f4}
#root{width:1080px;height:1920px;display:flex;flex-direction:column;background:#f8f7f4;padding:60px 80px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.icon-dot{width:100px;height:100px;border-radius:50%;border:1.5px solid #8a6a7a;display:flex;align-items:center;justify-content:center;font-size:36px;color:#8a6a7a;margin-bottom:24px}
.outro-title{font-size:46px;font-weight:800;line-height:1.1;letter-spacing:-1.5px;color:#1a1a1a;max-width:600px}
.outro-desc{font-size:22px;color:#bbb;line-height:1.45;max-width:480px;margin-top:10px}
.domain{font-size:13px;color:#ddd;letter-spacing:3px;text-transform:uppercase;margin-top:auto}
</style>
</head>
<body>
<div id="root">
  <div class="center">
    <div class="icon-dot">&#9733;</div>
    <div class="outro-title">Your story isn't over</div>
    <div class="outro-desc">Keep writing. Keep growing. Keep showing up.</div>
  </div>
  <div class="domain">1section.com</div>
</div>
</body>
</html>
