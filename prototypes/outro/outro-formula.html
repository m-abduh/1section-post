<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:'Satoshi';src:url('../../fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
body{font-family:'Satoshi',system-ui,sans-serif;background:#f8f7f4}
#root{width:1080px;height:1920px;display:flex;flex-direction:column;background:#f8f7f4;padding:60px 80px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.line{width:100%;max-width:500px;height:1px;background:#e8e4de;margin-bottom:36px}
.outro-title{font-size:50px;font-weight:800;line-height:1.1;letter-spacing:-2px;color:#1a1a1a;max-width:600px}
.outro-desc{font-size:24px;color:#bbb;line-height:1.45;max-width:500px;margin-top:12px}
.domain{font-size:13px;color:#ddd;letter-spacing:3px;text-transform:uppercase;margin-top:auto;text-align:center}
</style>
</head>
<body>
<div id="root">
  <div class="center">
    <div class="line"></div>
    <div class="outro-title">Follow the formula</div>
    <div class="outro-desc">The variables don't change. Do the work. Get the result.</div>
  </div>
  <div class="domain">1section.com</div>
</div>
</body>
</html>
