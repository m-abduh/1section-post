<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:'Satoshi';src:url('../../fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
body{font-family:'Satoshi',system-ui,sans-serif;background:#f8f7f4}
#root{width:1080px;height:1920px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f8f7f4;padding:60px 80px;text-align:center}
.icon-wrap{width:140px;height:140px;border:1.5px solid #6a8a5c;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:24px;position:relative}
.icon-wrap::after{content:'';position:absolute;inset:-6px;border:1px solid #e8e4de;border-radius:50%}
.icon-t{font-size:44px;color:#6a8a5c}
.outro-title{font-size:46px;font-weight:800;line-height:1.1;letter-spacing:-1.5px;color:#1a1a1a;max-width:600px}
.outro-desc{font-size:22px;color:#bbb;line-height:1.45;max-width:480px;margin-top:10px}
.domain{font-size:13px;color:#ddd;letter-spacing:3px;text-transform:uppercase;margin-top:28px}
</style>
</head>
<body>
<div id="root">
  <div class="icon-wrap"><div class="icon-t">&#9733;</div></div>
  <div class="outro-title">Tips you'll actually use</div>
  <div class="outro-desc">One tip at a time. That's all it takes.</div>
  <div class="domain">1section.com</div>
</div>
</body>
</html>
