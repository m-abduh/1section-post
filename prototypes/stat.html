<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stat — Prototype</title>
<link rel="stylesheet" href="doodle.css">
<style>
.container { --accent: #d4745d; }
.stat-wrap {
  display: flex;
  align-items: center;
  gap: 40px;
  max-width: 760px;
}
.stat-big {
  display: flex;
  align-items: baseline;
  gap: 4px;
  flex-shrink: 0;
}
.stat-num {
  font-size: 130px;
  font-weight: 800;
  line-height: 1;
  color: var(--accent);
  letter-spacing: -4px;
}
.stat-pct {
  font-size: 52px;
  font-weight: 700;
  color: var(--accent);
  opacity: .5;
}
.stat-body {
  font-size: 36px;
  line-height: 1.5;
  color: #1a1a1a;
  font-weight: 400;
}
</style>
</head>
<body>
<div class="container">

  <div class="eyebrow-row">
    <span class="eyebrow-accent">Did you know?</span>
    <div class="eyebrow-line"></div>
  </div>
  <div class="visual-area" style="flex-direction:column">
    <div class="title" style="margin-bottom:36px">The data is undeniable</div>
    <div class="stat-wrap">
      <div class="stat-big">
        <span class="stat-num">87</span>
        <span class="stat-pct">%</span>
      </div>
      <div class="stat-body">of people prefer the better option every single time they choose.</div>
    </div>
  </div>
  <div class="content-area">
    <div class="desc">
      Data shows a clear upward trend across all demographics.
    </div>
  </div>
</div>
</body>
</html>
