<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Story — Prototype</title>
<link rel="stylesheet" href="doodle.css">
<style>
.container { --accent: #8b7355; }
.label { background: rgba(139,115,85,.12); color: var(--accent); }
.story-hook {
  font-size: 48px;
  font-weight: 800;
  line-height: 1.2;
  max-width: 720px;
  text-align: center;
  letter-spacing: -1px;
}
.story-hook::before {
  content: '\201C';
  display: block;
  font-size: 80px;
  color: var(--accent);
  opacity: .1;
  font-weight: 900;
  line-height: .4;
  margin-bottom: 4px;
}
.story-body {
  font-size: 32px;
  line-height: 1.6;
  color: #555;
  max-width: 680px;
  text-align: center;
  margin-top: 12px;
}
.story-body::first-letter {
  color: var(--accent);
  font-weight: 700;
}
</style>
</head>
<body>
<div class="container">

  <div class="label-row">
    <span class="label">Story</span>
  </div>
  <div class="visual-area" style="flex-direction:column;gap:8px">
    <div class="story-hook">The day she stopped waiting for permission</div>
    <div class="story-body">
      She spent years asking others if she was good enough. Seeking approval from bosses, mentors, and even strangers. Until one day she realized the only permission she ever needed was her own.
    </div>
  </div>
  <div class="content-area">
    <div class="desc">
      Self-belief is the most powerful career move you can make.
    </div>
  </div>
</div>
</body>
</html>
