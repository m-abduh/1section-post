<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Myth vs Fact — Prototype</title>
<link rel="stylesheet" href="doodle.css">
<style>
.container { --accent-myth: #c4665d; --accent-fact: #5d9e7a; }
.label { background: rgba(100,116,139,.1); color: #64748b; }
.mf-wrap {
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
  max-width: 720px;
}
.mf-card {
  padding: 20px 24px;
  border-radius: 20px;
  position: relative;
}
.myth-card {
  background: rgba(196,102,93,.06);
  border-left: 4px solid var(--accent-myth);
}
.fact-card {
  background: rgba(93,158,122,.06);
  border-left: 4px solid var(--accent-fact);
}
.mf-label {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.mf-label.myth { color: var(--accent-myth); }
.mf-label.fact { color: var(--accent-fact); }
.mf-text {
  font-size: 32px;
  line-height: 1.45;
}
.mf-text.myth { color: #666; font-weight: 400; }
.mf-text.fact { color: #1a1a1a; font-weight: 600; }
.mf-vs {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  font-size: 14px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #bbb;
  font-weight: 700;
}
.mf-vs svg { width: 32px; height: 16px; }
</style>
</head>
<body>
<div class="container">

  <div class="label-row">
    <span class="label">Myth vs Fact</span>
  </div>
  <div class="visual-area" style="flex-direction:column;gap:0">
    <div class="mf-wrap">
      <div class="mf-card myth-card">
        <div class="mf-label myth">The Myth</div>
        <div class="mf-text myth">You need to work 80 hours a week to be successful.</div>
      </div>
      <div class="mf-vs">vs</div>
      <div class="mf-card fact-card">
        <div class="mf-label fact">The Truth</div>
        <div class="mf-text fact">Working smarter, not harder, is what actually works.</div>
      </div>
    </div>
  </div>
  <div class="content-area">
    <div class="desc">
      Productivity is about leverage, not hours.
    </div>
  </div>
</div>
</body>
</html>
