<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Myth vs Fact — Prototype</title>
<link rel="stylesheet" href="doodle.css">
<style>
.container { --accent: #c4665d; --accent-myth: #c4665d; --accent-fact: #5d9e7a; }
.mf-wrap {
  display: flex;
  flex-direction: column;
  gap: 0;
  max-width: 640px;
  align-self: center;
  width: 100%;
}
.mf-card {
  padding: 28px 32px;
  border-radius: 20px;
}
.myth-card {
  background: rgba(196,102,93,.05);
}
.fact-card {
  background: rgba(93,158,122,.05);
}
.mf-top {
  display: flex;
  align-items: flex-start;
  gap: 14px;
}
.mf-icon {
  font-size: 36px;
  line-height: 1;
  margin-top: 2px;
  min-width: 36px;
}
.myth-card .mf-icon { color: var(--accent-myth); }
.fact-card .mf-icon { color: var(--accent-fact); }
.mf-text {
  font-size: 28px;
  line-height: 1.5;
}
.myth-card .mf-text {
  color: #777;
  font-weight: 400;
  text-decoration: line-through;
}
.fact-card .mf-text {
  color: #1a1a1a;
  font-weight: 600;
}
.mf-line {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 32px;
  position: relative;
}
.mf-line::before {
  content: '';
  width: 2px;
  height: 100%;
  background: rgba(0,0,0,.06);
}
</style>
</head>
<body>
<div class="container">

  <div class="eyebrow-row">
    <span class="eyebrow-accent">Don't be fooled</span>
    <div class="eyebrow-line"></div>
  </div>
  <div class="visual-area" style="flex-direction:column">
    <div class="title" style="margin-bottom:36px">Don't believe everything</div>
    <div class="mf-wrap">
      <div class="mf-card myth-card">
        <div class="mf-top">
        <div class="mf-icon">&#10005;</div>
        <div class="mf-text">You need to work 80 hours a week to be successful.</div>
        </div>
      </div>
      <div class="mf-line"></div>
      <div class="mf-card fact-card">
        <div class="mf-top">
          <div class="mf-icon">&#10003;</div>
          <div class="mf-text">Working smarter, not harder, is what actually works.</div>
        </div>
      </div>
    </div>
  </div>
  <div class="content-area">
    <div class="desc">
      Productivity is about leverage, not hours.
    </div>
  </div>
</div>
</body>
</html>
