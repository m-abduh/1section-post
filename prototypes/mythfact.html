<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Myth vs Fact — Prototype</title>
<link rel="stylesheet" href="doodle.css">
<style>
.container { --accent-myth: #c4665d; --accent-fact: #5d9e7a; }
.mf-wrap {
  display: flex;
  flex-direction: column;
  gap: 16px;
  max-width: 680px;
  align-self: center;
  width: 100%;
}
.mf-card {
  padding: 24px 28px;
  border-radius: 20px;
}
.myth-card {
  background: rgba(196,102,93,.06);
}
.fact-card {
  background: rgba(93,158,122,.06);
}
.mf-label {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.mf-label.myth { color: var(--accent-myth); }
.mf-label.fact { color: var(--accent-fact); }
.mf-text {
  font-size: 30px;
  line-height: 1.5;
}
.mf-text.myth { color: #666; font-weight: 400; }
.mf-text.fact { color: #1a1a1a; font-weight: 600; }
.mf-vs {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  font-size: 14px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #ccc;
  font-weight: 700;
}
.mf-vs::before,
.mf-vs::after {
  content: '';
  width: 40px;
  height: 1px;
  background: rgba(0,0,0,.06);
}
</style>
</head>
<body>
<div class="container">

  <div class="eyebrow-row">
    <span class="eyebrow-accent">Don't be fooled</span>
    <div class="eyebrow-line"></div>
  </div>
  <div class="visual-area" style="flex-direction:column">
    <div class="mf-wrap">
      <div class="mf-card myth-card">
        <div class="mf-label myth">The Myth</div>
        <div class="mf-text myth">You need to work 80 hours a week to be successful.</div>
      </div>
      <div class="mf-vs">vs</div>
      <div class="mf-card fact-card">
        <div class="mf-label fact">The Truth</div>
        <div class="mf-text fact">Working smarter, not harder, is what actually works.</div>
      </div>
    </div>
  </div>
  <div class="content-area">
    <div class="desc">
      Productivity is about leverage, not hours.
    </div>
  </div>
</div>
</body>
</html>
