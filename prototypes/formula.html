<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Formula — Prototype</title>
<link rel="stylesheet" href="doodle.css">
<style>
.container { --accent: #c47a8a; }
.formula-wrap {
  display: flex;
  flex-direction: column;
  max-width: 720px;
  align-self: center;
  width: 100%;
}
.formula-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
}
.formula-term {
  padding: 12px 22px;
  background: rgba(196,122,138,.08);
  border-radius: 14px;
  font-size: 28px;
  font-weight: 700;
  color: #1a1a1a;
}
.formula-op {
  font-size: 32px;
  font-weight: 300;
  color: #bbb;
}
.formula-eq {
  font-size: 36px;
  font-weight: 700;
  color: #bbb;
}
.formula-result {
  padding: 12px 22px;
  background: var(--accent);
  border-radius: 14px;
  font-size: 28px;
  font-weight: 800;
  color: #fff;
}
.formula-caption {
  text-align: center;
  font-size: 22px;
  color: #999;
  margin-top: 14px;
}
</style>
</head>
<body>
<div class="container">

  <div class="eyebrow-row">
    <span class="eyebrow-accent">Simple math</span>
    <div class="eyebrow-line"></div>
  </div>
  <div class="visual-area" style="flex-direction:column">
    <div class="title" style="margin-bottom:36px">The only formula that matters</div>
    <div class="formula-wrap">
      <div class="formula-row">
        <div class="formula-term">Focus</div>
        <div class="formula-op">&times;</div>
        <div class="formula-term">Consistency</div>
        <div class="formula-eq">=</div>
        <div class="formula-result">Results</div>
      </div>
      <div class="formula-caption">The only equation that matters for growth.</div>
    </div>
  </div>
  <div class="content-area">
    <div class="desc">
      Get these two right, and everything else follows.
    </div>
  </div>
</div>
</body>
</html>
