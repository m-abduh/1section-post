<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quote — Prototype</title>
<link rel="stylesheet" href="doodle.css">
<style>
.container { --accent: #7c5f7e; }
.label { background: rgba(124,95,126,.1); color: var(--accent); }
.quote-mark {
  font-size: 120px;
  font-weight: 900;
  line-height: .6;
  color: var(--accent);
  opacity: .12;
  margin-bottom: -20px;
}
.quote-text {
  font-size: 48px;
  font-weight: 400;
  line-height: 1.45;
  max-width: 780px;
  text-align: center;
  font-style: italic;
}
.quote-source {
  font-size: 28px;
  color: var(--accent);
  font-weight: 600;
  margin-top: 16px;
}
</style>
</head>
<body>
<div class="container">

  <div class="label-row">
    <span class="label">Quote</span>
  </div>
  <div class="visual-area">
    <div style="display:flex;flex-direction:column;align-items:center">
      <div class="quote-mark">&ldquo;</div>
      <div class="quote-text">
        The only way to do great work is to love what you do.
      </div>
      <div class="quote-source">&mdash; Steve Jobs</div>
    </div>
  </div>
  <div class="content-area">
    <div class="desc">
      Passion is the foundation of meaningful achievement.
    </div>
  </div>
</div>
</body>
</html>
