<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warning — Prototype</title>
<link rel="stylesheet" href="doodle.css">
<style>
.container { --accent: #c4665d; }
.warn-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: 620px;
  align-self: center;
  width: 100%;
  padding: 36px 40px;
  background: rgba(196,102,93,.06);
  border-radius: 24px;
  text-align: center;
}
.warn-icon {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 16px;
}
.warn-icon span {
  font-size: 28px;
  font-weight: 700;
  color: #fff;
}
.warn-title {
  font-size: 36px;
  font-weight: 800;
  color: var(--accent);
  margin-bottom: 8px;
}
.warn-text {
  font-size: 26px;
  line-height: 1.55;
  color: #555;
  max-width: 500px;
}
</style>
</head>
<body>
<div class="container">

  <div class="eyebrow-row">
    <span class="eyebrow-accent">Heads up</span>
    <div class="eyebrow-line"></div>
  </div>
  <div class="visual-area" style="flex-direction:column">
    <div class="warn-card">
      <div class="warn-icon"><span>!</span></div>
      <div>
        <div class="warn-title">Burnout is coming</div>
        <div class="warn-text">Working 10+ hours daily without breaks doesn&#8217;t make you productive. It makes you exhausted.</div>
      </div>
    </div>
  </div>
  <div class="content-area">
    <div class="desc">
      Rest is a strategy, not a reward.
    </div>
  </div>
</div>
</body>
</html>
