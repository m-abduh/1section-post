<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warning — Prototype</title>
<link rel="stylesheet" href="doodle.css">
<style>
.container { --accent: #c49a6a; }
.warn-card {
  max-width: 640px;
  align-self: center;
  width: 100%;
  padding: 32px 32px;
  background: rgba(196,154,106,.07);
  border-radius: 20px;
  display: flex;
  align-items: flex-start;
  gap: 16px;
}
.warn-icon {
  width: 36px;
  height: 36px;
  min-width: 36px;
  border-radius: 50%;
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 700;
  color: #fff;
  margin-top: 2px;
}
.warn-text {
  font-size: 28px;
  line-height: 1.55;
  color: #555;
}
</style>
</head>
<body>
<div class="container">

  <div class="eyebrow-row">
    <span class="eyebrow-accent">Heads up</span>
    <div class="eyebrow-line"></div>
  </div>
  <div class="visual-area" style="flex-direction:column">
    <div class="title" style="margin-bottom:36px">You're heading for burnout</div>
      <div class="warn-card">
        <span class="warn-icon">!</span>
        <div class="warn-text">Working 10+ hours daily without breaks doesn&#8217;t make you productive. It makes you exhausted.</div>
  </div>
  </div>
  <div class="content-area">
    <div class="desc">
      Rest is a strategy, not a reward.
    </div>
  </div>
</div>
</body>
</html>
