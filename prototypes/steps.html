<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Steps — Prototype</title>
<link rel="stylesheet" href="doodle.css">
<style>
.container { --accent: #5a8f8f; }
.label { background: rgba(90,143,143,.12); color: var(--accent); }
.steps-list {
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 700px;
}
.step-row {
  display: flex;
  gap: 20px;
  position: relative;
}
.step-left {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 48px;
  min-width: 48px;
}
.step-dot {
  width: 48px;
  height: 48px;
  min-width: 48px;
  border-radius: 50%;
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 800;
  color: #fff;
  position: relative;
  z-index: 1;
}
.step-line {
  width: 2px;
  flex: 1;
  background: linear-gradient(180deg, var(--accent), rgba(90,143,143,.15));
  opacity: .3;
}
.step-card {
  flex: 1;
  padding: 14px 0 24px;
}
.step-title {
  font-size: 34px;
  font-weight: 700;
  margin-top: 4px;
}
.step-desc {
  font-size: 26px;
  color: #888;
  margin-top: 2px;
}
</style>
</head>
<body>
<div class="container">

  <div class="label-row">
    <span class="label">Steps</span>
  </div>
  <div class="visual-area" style="flex:none;flex-direction:column;width:100%;padding:20px 0;align-items:flex-start">
    <div class="steps-list">
      <div class="step-row">
        <div class="step-left">
          <div class="step-dot">1</div>
          <div class="step-line"></div>
        </div>
        <div class="step-card">
          <div class="step-title">Start with why</div>
          <div class="step-desc">Understand your core motivation before taking action.</div>
        </div>
      </div>
      <div class="step-row">
        <div class="step-left">
          <div class="step-dot">2</div>
          <div class="step-line"></div>
        </div>
        <div class="step-card">
          <div class="step-title">Build momentum</div>
          <div class="step-desc">Small consistent wins compound into massive results.</div>
        </div>
      </div>
      <div class="step-row">
        <div class="step-left">
          <div class="step-dot">3</div>
        </div>
        <div class="step-card">
          <div class="step-title">Stay adaptable</div>
          <div class="step-desc">Adjust your approach based on what the data tells you.</div>
        </div>
      </div>
    </div>
  </div>
  <div class="content-area" style="margin-top:auto">
    <div class="desc">
      Follow these steps to transform your approach completely.
    </div>
  </div>
</div>
</body>
</html>
