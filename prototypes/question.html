<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Question — Prototype</title>
<link rel="stylesheet" href="doodle.css">
<style>
.container { --accent: #c47a8a; }
.label { background: rgba(196,122,138,.1); color: var(--accent); }
.question-text {
  font-size: 44px;
  font-weight: 800;
  line-height: 1.3;
  text-align: center;
  max-width: 720px;
}
.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 620px;
  margin-top: 8px;
}
.option {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 20px;
  background: #faf8f5;
  border-radius: 14px;
  font-size: 30px;
}
.option-marker {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 2px solid var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
  color: var(--accent);
  opacity: .5;
  min-width: 36px;
}
</style>
</head>
<body>
<div class="container">

  <div class="label-row">
    <span class="label">Quick Poll</span>
  </div>
  <div class="visual-area" style="flex-direction:column;gap:16px">
    <div class="question-text">What matters most in your career?</div>
    <div class="options">
      <div class="option"><div class="option-marker">A</div>Money &amp; stability</div>
      <div class="option"><div class="option-marker">B</div>Growth &amp; learning</div>
      <div class="option"><div class="option-marker">C</div>Impact &amp; purpose</div>
      <div class="option"><div class="option-marker">D</div>Freedom &amp; flexibility</div>
    </div>
  </div>
  <div class="content-area">
    <div class="desc">
      Your answer says a lot about where you are in life.
    </div>
  </div>
</div>
</body>
</html>
