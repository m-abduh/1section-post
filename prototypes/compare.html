<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compare — Prototype</title>
<link rel="stylesheet" href="doodle.css">
<style>
.container { --accent: #c49a4a; }
.comp-wrap {
  display: flex;
  flex-direction: column;
  max-width: 680px;
  align-self: center;
  width: 100%;
}
.comp-headers {
  display: flex;
  margin-bottom: 16px;
  padding: 0 20px;
}
.comp-h-before {
  flex: 1;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #bbb;
}
.comp-h-after {
  flex: 1;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--accent);
  text-align: right;
}
.comp-row {
  display: flex;
  align-items: center;
  padding: 16px 20px;
  border-bottom: 1px solid rgba(0,0,0,.04);
}
.comp-row:last-child { border: 0; }
.comp-before {
  flex: 1;
  font-size: 26px;
  color: #bbb;
  font-weight: 400;
  padding-right: 20px;
}
.comp-after {
  flex: 1;
  font-size: 26px;
  color: #1a1a1a;
  font-weight: 600;
  text-align: right;
  padding-left: 20px;
}
</style>
</head>
<body>
<div class="container">

  <div class="eyebrow-row">
    <span class="eyebrow-accent">Side by side</span>
    <div class="eyebrow-line"></div>
  </div>
  <div class="visual-area" style="flex-direction:column">
    <div class="title" style="margin-bottom:36px">The better path is obvious</div>
    <div class="comp-wrap">
      <div class="comp-headers">
        <div class="comp-h-before">Before</div>
        <div class="comp-h-after">After</div>
      </div>
      <div class="comp-row">
        <div class="comp-before">Takes months to see results</div>
        <div class="comp-after">See progress in days</div>
      </div>
      <div class="comp-row">
        <div class="comp-before">Requires expensive tools</div>
        <div class="comp-after">Free or low-cost solutions</div>
      </div>
      <div class="comp-row">
        <div class="comp-before">Complex and confusing</div>
        <div class="comp-after">Simple and intuitive</div>
      </div>
    </div>
  </div>
  <div class="content-area">
    <div class="desc">
      Small shifts in approach lead to vastly different outcomes.
    </div>
  </div>
</div>
</body>
</html>
