<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:'Satoshi';src:url('../../fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
body{font-family:'Satoshi',system-ui,sans-serif;background:#faf8f5}
#root{width:1080px;height:1920px;display:flex;background:#faf8f5;position:relative}
.left-quote{width:380px;background:#9a7b5c;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.left-quote .q-big{font-size:360px;color:rgba(255,255,255,.08);font-family:Georgia,serif;line-height:1;position:absolute}
.tag{position:absolute;top:60px;left:60px;font-size:11px;color:rgba(255,255,255,.4);letter-spacing:6px;text-transform:uppercase;font-weight:600;z-index:2;writing-mode:vertical-lr}
.right-text{flex:1;display:flex;flex-direction:column;justify-content:center;padding:60px 70px}
.right-text .intro-title{font-size:44px;font-weight:800;line-height:1.15;letter-spacing:-1.5px;color:#1a1a1a;max-width:480px}
.right-text .intro-desc{font-size:20px;color:#bbb;line-height:1.5;max-width:420px;margin-top:10px}
.right-text .divider{width:50px;height:1px;background:#e8e4de;margin:16px 0}
.right-text .domain{font-size:11px;color:#ddd;letter-spacing:3px;text-transform:uppercase}
</style>
</head>
<body>
<div id="root">
  <div class="left-quote">
    <div class="q-big">&ldquo;</div>
    <div class="tag">Quote</div>
  </div>
  <div class="right-text">
    <div class="intro-title">Words that stick with you</div>
    <div class="intro-desc">A great quote hits different. Wisdom in one line.</div>
    <div class="divider"></div>
    <div class="domain">1section.com</div>
  </div>
</div>
</body>
</html>
