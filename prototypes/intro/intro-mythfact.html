<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:'Satoshi';src:url('../../fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
body{font-family:'Satoshi',system-ui,sans-serif;background:#faf8f5}
#root{width:1080px;height:1920px;display:flex;flex-direction:column;background:#faf8f5;position:relative;overflow:hidden}
.card-myth{position:absolute;top:5%;right:-8%;width:55%;height:50%;background:#e8d6d6;border-radius:32px;transform:rotate(8deg)}
.card-fact{position:absolute;bottom:5%;left:-8%;width:55%;height:50%;background:#d6e4d6;border-radius:32px;transform:rotate(-8deg)}
.card-myth .lbl{position:absolute;bottom:24px;left:24px;font-size:60px;font-weight:900;color:rgba(180,120,120,.15);letter-spacing:-3px;line-height:1}
.card-fact .lbl{position:absolute;top:24px;right:24px;font-size:60px;font-weight:900;color:rgba(100,160,100,.15);letter-spacing:-3px;line-height:1}
.tag{position:absolute;top:60px;left:80px;font-size:11px;color:#b08a5c;letter-spacing:6px;text-transform:uppercase;font-weight:600;z-index:2}
.domain{position:absolute;bottom:60px;right:80px;font-size:11px;color:#ddd;letter-spacing:3px;text-transform:uppercase;z-index:2}
.center-text{z-index:2;align-self:center;text-align:center;margin:auto;max-width:520px;padding:0 40px}
.center-text .icon{font-size:48px;color:#b08a5c;margin-bottom:8px}
.center-text .intro-title{font-size:50px;font-weight:800;line-height:1.1;letter-spacing:-2px;color:#1a1a1a}
.center-text .intro-desc{font-size:22px;color:#bbb;line-height:1.5;margin-top:10px}
</style>
</head>
<body>
<div id="root">
  <div class="card-myth"><div class="lbl">Myth</div></div>
  <div class="card-fact"><div class="lbl">Fact</div></div>
  <div class="tag">Myth vs Fact</div>
  <div class="center-text">
    <div class="icon">&#8730;</div>
    <div class="intro-title">Separate truth from fiction</div>
    <div class="intro-desc">Everything you know might be wrong. Get the real story.</div>
  </div>
  <div class="domain">1section.com</div>
</div>
</body>
</html>
