<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.45.0/dist/tabler-icons.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:'Satoshi';src:url('../../fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
body{font-family:'Satoshi',system-ui,sans-serif;background:#faf8f5}
#root{width:1080px;height:1920px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#faf8f5;padding:80px}
.icon-wrap{width:80px;height:80px;display:flex;align-items:center;justify-content:center}
.intro-hline{width:40px;height:2px;background:#d4745d;border-radius:2px;margin:8px auto 12px;opacity:.6}
.icon-wrap .ti{font-size:72px;color:#d4745d}
.intro-title{font-size:56px;font-weight:800;line-height:1.12;letter-spacing:-2.5px;color:#1a1a1a;max-width:680px}
.intro-desc{font-size:24px;color:#bababa;line-height:1.45;max-width:540px;margin-top:12px;font-weight:400}
.intro-divider{width:32px;height:2px;background:#e8e4de;border-radius:2px;margin:18px auto}
.intro-domain{font-size:13px;color:#d0d0d0;letter-spacing:4px;text-transform:uppercase;font-weight:500}
</style>
</head>
<body>
<div id="root">
  <div class="icon-wrap"><i class="ti ti-chart-bar"></i></div>
  <div class="intro-hline"></div>
  <div class="intro-title">Numbers don't lie</div>
  <div class="intro-desc">One percent better every day changes everything.</div>
  <div class="intro-divider"></div>
  <div class="intro-domain">1section.com</div>
</div>
</body>
</html>
