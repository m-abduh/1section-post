<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:'Satoshi';src:url('../../fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
body{font-family:'Satoshi',system-ui,sans-serif;background:#faf8f5}
#root{width:1080px;height:1920px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#faf8f5;position:relative;overflow:hidden}
.hex-grid{position:absolute;inset:0;background:
  radial-gradient(circle at 25% 25%,rgba(154,106,90,.04) 0%,transparent 50%),
  radial-gradient(circle at 75% 75%,rgba(154,106,90,.04) 0%,transparent 50%),
  radial-gradient(circle at 50% 50%,rgba(154,106,90,.03) 0%,transparent 50%);
background-size:180px 180px;pointer-events:none}
.hex-grid::after{content:'';position:absolute;inset:0;
background-image:
  linear-gradient(60deg,transparent 49.5%,rgba(154,106,90,.04) 50%,transparent 50.5%),
  linear-gradient(-60deg,transparent 49.5%,rgba(154,106,90,.04) 50%,transparent 50.5%);
background-size:180px 104px}
.tag{position:absolute;top:60px;left:80px;font-size:11px;color:#9a6a5a;letter-spacing:6px;text-transform:uppercase;font-weight:600;z-index:2}
.domain{position:absolute;bottom:60px;right:80px;font-size:11px;color:#ddd;letter-spacing:3px;text-transform:uppercase;z-index:2}
.icon-block{position:relative;z-index:2;margin-bottom:24px}
.icon-block .hex{width:120px;height:120px;background:transparent;border:3px solid #9a6a5a;display:flex;align-items:center;justify-content:center;font-size:48px;color:#9a6a5a;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);margin:0 auto}
.icon-block .hex-sm{width:80px;height:80px;border:2px solid #9a6a5a;opacity:.15;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);position:absolute;top:-24px;right:-20px}
.icon-block .excl{font-size:64px;color:#9a6a5a;line-height:1}
.content{z-index:2;text-align:center;max-width:560px;padding:0 40px}
.content .intro-title{font-size:46px;font-weight:800;line-height:1.1;letter-spacing:-2px;color:#1a1a1a}
.content .intro-title .glitch{color:#9a6a5a}
.content .intro-desc{font-size:20px;color:#bbb;line-height:1.45;margin-top:8px}
</style>
</head>
<body>
<div id="root">
  <div class="hex-grid"></div>
  <div class="hex-grid" style="opacity:.5"></div>
  <div class="tag">Warning</div>
  <div class="icon-block">
    <div class="hex-sm"></div>
    <div class="hex">!</div>
  </div>
  <div class="content">
    <div class="intro-title">What they <span class="glitch">don't</span> tell you</div>
    <div class="intro-desc">The warning signs are there. You just have to see them.</div>
  </div>
  <div class="domain">1section.com</div>
</div>
</body>
</html>
