<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:'Satoshi';src:url('../../fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
body{font-family:'Satoshi',system-ui,sans-serif;background:#faf8f5}
#root{width:1080px;height:1920px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#faf8f5;padding:80px;position:relative}
.tag{position:absolute;top:60px;left:80px;font-size:11px;color:#9a8855;letter-spacing:6px;text-transform:uppercase;font-weight:600}
.domain{position:absolute;bottom:60px;right:80px;font-size:11px;color:#ddd;letter-spacing:3px;text-transform:uppercase}
.pyramid{display:flex;flex-direction:column;align-items:center;width:100%;max-width:500px;margin-bottom:24px}
.tier{display:flex;align-items:center;border-radius:12px;padding:16px 24px;margin-bottom:4px;color:#fff;font-weight:700;transition:all .2s;justify-content:space-between}
.tier .rank{font-size:28px;font-weight:900;letter-spacing:-1px}
.tier .tier-label{font-size:20px;font-weight:500;opacity:.8}
.tier-s{width:100%;background:#9a8855}
.tier-a{width:80%;background:#b5a878}
.tier-b{width:60%;background:#c9be96}
.content{text-align:center}
.content .intro-title{font-size:40px;font-weight:800;line-height:1.1;letter-spacing:-1.5px;color:#1a1a1a}
.content .intro-desc{font-size:18px;color:#bbb;line-height:1.45;margin-top:6px;max-width:500px}
</style>
</head>
<body>
<div id="root">
  <div class="tag">Tierlist</div>
  <div class="pyramid">
    <div class="tier tier-s"><span class="rank">S</span><span class="tier-label">Mindset</span></div>
    <div class="tier tier-a"><span class="rank">A</span><span class="tier-label">Actions</span></div>
    <div class="tier tier-b"><span class="rank">B</span><span class="tier-label">Tools</span></div>
  </div>
  <div class="content">
    <div class="intro-title">Rank what matters</div>
    <div class="intro-desc">Not everything is equal. Learn what belongs at the top.</div>
  </div>
  <div class="domain">1section.com</div>
</div>
</body>
</html>
