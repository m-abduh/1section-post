<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:'Satoshi';src:url('../../fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
body{font-family:'Satoshi',system-ui,sans-serif;background:#faf8f5}
#root{width:1080px;height:1920px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;background:#faf8f5;padding:80px;position:relative;overflow:hidden}
.tag{position:absolute;top:60px;left:80px;font-size:11px;color:#6a8a5c;letter-spacing:6px;text-transform:uppercase;font-weight:600;z-index:2}
.domain{position:absolute;bottom:60px;right:80px;font-size:11px;color:#ddd;letter-spacing:3px;text-transform:uppercase;z-index:2}
.top-text{text-align:center;margin-bottom:auto;padding-top:120px;z-index:2}
.top-text .intro-title{font-size:42px;font-weight:800;line-height:1.1;letter-spacing:-1.5px;color:#1a1a1a}
.top-text .intro-desc{font-size:20px;color:#bbb;line-height:1.45;margin-top:6px;max-width:520px}
.fan-area{position:relative;width:100%;height:320px;display:flex;align-items:center;justify-content:center;margin-top:30px}
.fan-card{position:absolute;width:260px;height:100px;border-radius:16px;background:#fff;border:1px solid #f3f1ee;display:flex;align-items:center;padding:0 24px;gap:14px;box-shadow:0 4px 16px rgba(0,0,0,.03)}
.fan-card .num{width:40px;height:40px;border-radius:12px;background:#6a8a5c;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;flex-shrink:0}
.fan-card .txt{font-size:20px;font-weight:700;color:#1a1a1a}
.fan-card:nth-child(1){transform:rotate(-12deg) translateY(20px);z-index:1}
.fan-card:nth-child(2){transform:rotate(0deg);z-index:2}
.fan-card:nth-child(3){transform:rotate(12deg) translateY(20px);z-index:1}
</style>
</head>
<body>
<div id="root">
  <div class="tag">Tips</div>
  <div class="top-text">
    <div class="intro-title">Tips that actually work</div>
    <div class="intro-desc">Forget the fluff. These are the ones that make a difference.</div>
  </div>
  <div class="fan-area">
    <div class="fan-card"><div class="num">1</div><div class="txt">Start small</div></div>
    <div class="fan-card"><div class="num">2</div><div class="txt">Stay consistent</div></div>
    <div class="fan-card"><div class="num">3</div><div class="txt">Track progress</div></div>
  </div>
  <div class="domain">1section.com</div>
</div>
</body>
</html>
