<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:'Satoshi';src:url('../../fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
body{font-family:'Satoshi',system-ui,sans-serif;background:#faf8f5}
#root{width:1080px;height:1920px;display:flex;flex-direction:column;background:#faf8f5;position:relative;overflow:hidden;padding:80px}
.tag{position:absolute;top:60px;left:80px;font-size:11px;color:#5a8f8f;letter-spacing:6px;text-transform:uppercase;font-weight:600}
.domain{position:absolute;bottom:60px;right:80px;font-size:11px;color:#ddd;letter-spacing:3px;text-transform:uppercase}
.stair-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;position:relative;margin-top:60px}
.stair-row{display:flex;align-items:center;margin-bottom:12px;opacity:0}
.stair-row:nth-child(1){margin-left:0;opacity:1}
.stair-row:nth-child(2){margin-left:80px;opacity:1}
.stair-row:nth-child(3){margin-left:160px;opacity:1}
.stair-row:nth-child(4){margin-left:240px;opacity:1}
.stair-block{width:180px;height:56px;border-radius:12px;background:#5a8f8f;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;letter-spacing:1px}
.stair-line{flex:1;height:1px;background:#e8e4de;margin-left:16px}
.stair-row .step-label{font-size:28px;font-weight:700;color:#1a1a1a;margin-left:16px;white-space:nowrap}
.text-area{text-align:center;padding:40px 0 20px}
.text-area .intro-title{font-size:44px;font-weight:800;line-height:1.1;letter-spacing:-1.5px;color:#1a1a1a}
.text-area .intro-desc{font-size:20px;color:#bbb;line-height:1.45;margin-top:6px;max-width:540px;margin-left:auto;margin-right:auto}
</style>
</head>
<body>
<div id="root">
  <div class="tag">Steps</div>
  <div class="stair-wrap">
    <div class="stair-row">
      <div class="stair-block">Step&nbsp;1</div>
      <div class="stair-line"></div>
      <div class="step-label">Learn</div>
    </div>
    <div class="stair-row">
      <div class="stair-block">Step&nbsp;2</div>
      <div class="stair-line"></div>
      <div class="step-label">Apply</div>
    </div>
    <div class="stair-row">
      <div class="stair-block">Step&nbsp;3</div>
      <div class="stair-line"></div>
      <div class="step-label">Grow</div>
    </div>
    <div class="stair-row">
      <div class="stair-block">Step&nbsp;4</div>
      <div class="stair-line"></div>
      <div class="step-label">Succeed</div>
    </div>
  </div>
  <div class="text-area">
    <div class="intro-title">Follow the steps</div>
    <div class="intro-desc">Break it down. One step at a time. Progress is a process.</div>
  </div>
  <div class="domain">1section.com</div>
</div>
</body>
</html>
