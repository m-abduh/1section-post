<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:'Satoshi';src:url('../../fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
body{font-family:'Satoshi',system-ui,sans-serif;background:#faf8f5}
#root{width:1080px;height:1920px;display:flex;align-items:center;justify-content:center;background:#faf8f5;position:relative;overflow:hidden}
.q-grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);padding:40px}
.q-grid span{display:flex;align-items:center;justify-content:center;font-size:24px;color:#6a8a8a;opacity:.06;font-weight:700}
.q-grid span:nth-child(odd){font-size:36px;opacity:.04}
.tag{position:absolute;top:60px;left:80px;font-size:11px;color:#6a8a8a;letter-spacing:6px;text-transform:uppercase;font-weight:600;z-index:2}
.domain{position:absolute;bottom:60px;right:80px;font-size:11px;color:#ddd;letter-spacing:3px;text-transform:uppercase;z-index:2}
.bubble{z-index:2;background:#fff;border-radius:40px 40px 40px 8px;padding:36px 48px;max-width:560px;box-shadow:0 4px 24px rgba(0,0,0,.04);text-align:center;position:relative}
.bubble::before{content:'?';position:absolute;top:-16px;left:-16px;width:40px;height:40px;border-radius:50%;background:#6a8a8a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
.bubble .intro-title{font-size:44px;font-weight:800;line-height:1.15;letter-spacing:-1.5px;color:#1a1a1a}
.bubble .intro-desc{font-size:20px;color:#bbb;line-height:1.5;margin-top:8px}
</style>
</head>
<body>
<div id="root">
  <div class="q-grid">
    <span>?</span><span>?</span><span>?</span><span>?</span><span>?</span><span>?</span>
    <span>?</span><span>?</span><span>?</span><span>?</span><span>?</span><span>?</span>
    <span>?</span><span>?</span><span>?</span><span>?</span><span>?</span><span>?</span>
    <span>?</span><span>?</span><span>?</span><span>?</span><span>?</span><span>?</span>
    <span>?</span><span>?</span><span>?</span><span>?</span><span>?</span><span>?</span>
    <span>?</span><span>?</span><span>?</span><span>?</span><span>?</span><span>?</span>
  </div>
  <div class="tag">Q&A</div>
  <div class="bubble">
    <div class="intro-title">The answers you've been looking for</div>
    <div class="intro-desc">One question. One answer. Clarity in minutes.</div>
  </div>
  <div class="domain">1section.com</div>
</div>
</body>
</html>
