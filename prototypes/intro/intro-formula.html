<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<style>
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:'Satoshi';src:url('../../fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
body{font-family:'Satoshi',system-ui,sans-serif;background:#faf8f5}
#root{width:1080px;height:1920px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#faf8f5;position:relative;overflow:hidden}
.eq-bg{position:absolute;font-size:600px;font-weight:900;color:#6a7a9a;opacity:.04;line-height:1;font-family:Georgia,serif;transform:rotate(-12deg);top:40%;left:-10%}
.tag{position:absolute;top:60px;left:80px;font-size:11px;color:#6a7a9a;letter-spacing:6px;text-transform:uppercase;font-weight:600}
.domain{position:absolute;bottom:60px;right:80px;font-size:11px;color:#ddd;letter-spacing:3px;text-transform:uppercase}
.formula-line{display:flex;align-items:center;gap:24px;z-index:2;margin-bottom:20px}
.formula-line .var{font-size:64px;font-weight:300;color:#bbb;letter-spacing:-3px}
.formula-line .op{font-size:40px;color:#ddd;font-weight:300}
.formula-line .eq{font-size:56px;color:#6a7a9a;font-weight:300;margin:0 8px}
.formula-line .result{font-size:60px;font-weight:800;color:#6a7a9a;letter-spacing:-2px}
.content{z-index:2;text-align:center;margin-top:20px}
.content .intro-title{font-size:44px;font-weight:800;line-height:1.15;letter-spacing:-1.5px;color:#1a1a1a}
.content .intro-desc{font-size:20px;color:#bbb;line-height:1.45;margin-top:8px;max-width:560px}
</style>
</head>
<body>
<div id="root">
  <div class="eq-bg">&#8752;</div>
  <div class="tag">Formula</div>
  <div class="formula-line">
    <span class="var">X</span>
    <span class="op">+</span>
    <span class="var">Y</span>
    <span class="eq">=</span>
    <span class="result">Success</span>
  </div>
  <div class="content">
    <div class="intro-title">The formula changes everything</div>
    <div class="intro-desc">Simple variables. Proven results. Do the math.</div>
  </div>
  <div class="domain">1section.com</div>
</div>
</body>
</html>
