<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Intro — Prototype</title>
<link rel="stylesheet" href="doodle.css">
<style>
.container{--accent:#1a1a1a;align-items:center;justify-content:center}
.marks{position:absolute;inset:50px 70px;pointer-events:none}
.mark{position:absolute;width:8px;height:8px;border-radius:50%;background:rgba(0,0,0,.06)}
.mark:nth-child(1){top:0;left:0}
.mark:nth-child(2){top:0;right:0}
.mark:nth-child(3){bottom:0;left:0}
.mark:nth-child(4){bottom:0;right:0}
.mark:nth-child(5){top:50%;left:0}
.mark:nth-child(6){top:50%;right:0}
.mark:nth-child(7){top:0;left:50%}
.mark:nth-child(8){bottom:0;left:50%}
.brand{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;z-index:1}
.brand-icon{width:72px;height:72px;border-radius:18px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:#fff;margin-bottom:8px}
.brand-name{font-size:72px;font-weight:800;letter-spacing:-2px;color:#1a1a1a;line-height:1}
.brand-name em{font-style:normal;color:var(--accent)}
.brand-line{width:60px;height:3px;background:var(--accent);border-radius:2px;margin:20px 0}
.brand-tag{font-size:22px;font-weight:400;color:#999;letter-spacing:6px;text-transform:uppercase}
.brand-sub{font-size:16px;color:#ccc;letter-spacing:2px;text-transform:uppercase;margin-top:4px}
</style>
</head>
<body>
<div class="container">
  <div class="marks">
    <div class="mark"></div>
    <div class="mark"></div>
    <div class="mark"></div>
    <div class="mark"></div>
    <div class="mark"></div>
    <div class="mark"></div>
    <div class="mark"></div>
    <div class="mark"></div>
  </div>
  <div class="brand">
    <div class="brand-icon">1s</div>
    <div class="brand-name"><em>1</em>section</div>
    <div class="brand-line"></div>
    <div class="brand-tag">Your daily dose of insight</div>
    <div class="brand-sub">Ideas that stick</div>
  </div>
</div>
</body>
</html>
