<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tier List — Prototype</title>
<link rel="stylesheet" href="doodle.css">
<style>
.container { --accent: #b0884a; }
.tier-wrap {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: 620px;
  align-self: center;
  width: 100%;
}
.tier-row {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 24px;
  border-radius: 14px;
}
.tier-row.s { background: rgba(176,136,74,.06); }
.tier-row.a { background: rgba(122,158,140,.06); }
.tier-row.b { background: rgba(122,142,158,.06); }
.tier-row.c { background: rgba(200,200,200,.06); }
.tier-badge {
  width: 32px;
  height: 32px;
  min-width: 32px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 800;
  color: #fff;
}
.tier-row.s .tier-badge { background: #b0884a; }
.tier-row.a .tier-badge { background: #7a9e8c; }
.tier-row.b .tier-badge { background: #7a8e9e; }
.tier-row.c .tier-badge { background: #ccc; }
.tier-title {
  font-size: 28px;
  font-weight: 700;
  color: #1a1a1a;
}
.tier-desc {
  font-size: 20px;
  color: #bbb;
  margin-top: 2px;
}
</style>
</head>
<body>
<div class="container">

  <div class="eyebrow-row">
    <span class="eyebrow-accent">The verdict</span>
    <div class="eyebrow-line"></div>
  </div>
  <div class="visual-area" style="flex-direction:column">
    <div class="title" style="margin-bottom:36px">Not all methods are worth your time</div>
    <div class="tier-wrap">
      <div class="tier-row s">
        <div class="tier-badge">S</div>
        <div>
          <div class="tier-title">80/20 Rule</div>
          <div class="tier-desc">Highest leverage — do this first</div>
        </div>
      </div>
      <div class="tier-row a">
        <div class="tier-badge">A</div>
        <div>
          <div class="tier-title">Deep Work</div>
          <div class="tier-desc">Focused, uninterrupted sessions</div>
        </div>
      </div>
      <div class="tier-row b">
        <div class="tier-badge">B</div>
        <div>
          <div class="tier-title">Task Batching</div>
          <div class="tier-desc">Group similar work together</div>
        </div>
      </div>
      <div class="tier-row c">
        <div class="tier-badge">C</div>
        <div>
          <div class="tier-title">To-Do Lists</div>
          <div class="tier-desc">Better than nothing</div>
        </div>
      </div>
    </div>
  </div>
  <div class="content-area">
    <div class="desc">
      Not all productivity methods are created equal.
    </div>
  </div>
</div>
</body>
</html>
