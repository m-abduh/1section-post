<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tier List — Prototype</title>
<link rel="stylesheet" href="doodle.css">
<style>
.container { --accent: #b0884a; }
.tier-wrap {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 600px;
  align-self: center;
  width: 100%;
}
.tier-card {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 20px 28px;
  border-radius: 16px;
}
.tier-card.s { background: rgba(176,136,74,.07); }
.tier-card.a { background: rgba(122,158,140,.07); }
.tier-card.b { background: rgba(122,142,158,.07); }
.tier-card.c { background: rgba(176,176,176,.07); }
.tier-label {
  width: 48px;
  height: 48px;
  min-width: 48px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 800;
}
.tier-card.s .tier-label { background: rgba(176,136,74,.15); color: #b0884a; }
.tier-card.a .tier-label { background: rgba(122,158,140,.15); color: #7a9e8c; }
.tier-card.b .tier-label { background: rgba(122,142,158,.15); color: #7a8e9e; }
.tier-card.c .tier-label { background: rgba(176,176,176,.15); color: #b0b0b0; }
.tier-title {
  font-size: 28px;
  font-weight: 700;
}
.tier-desc {
  font-size: 22px;
  color: #999;
  margin-top: 1px;
}
</style>
</head>
<body>
<div class="container">

  <div class="eyebrow-row">
    <span class="eyebrow-accent">The verdict</span>
    <div class="eyebrow-line"></div>
  </div>
  <div class="visual-area" style="flex-direction:column">
    <div class="title" style="margin-bottom:36px">Not all methods are worth your time</div>
    <div class="tier-wrap">
      <div class="tier-card s">
        <div class="tier-label">S</div>
        <div>
          <div class="tier-title">80/20 Rule</div>
          <div class="tier-desc">Highest leverage activity you can do</div>
        </div>
      </div>
      <div class="tier-card a">
        <div class="tier-label">A</div>
        <div>
          <div class="tier-title">Deep Work</div>
          <div class="tier-desc">Focused, uninterrupted sessions</div>
        </div>
      </div>
      <div class="tier-card b">
        <div class="tier-label">B</div>
        <div>
          <div class="tier-title">Task Batching</div>
          <div class="tier-desc">Group similar work together</div>
        </div>
      </div>
      <div class="tier-card c">
        <div class="tier-label">C</div>
        <div>
          <div class="tier-title">To-Do Lists</div>
          <div class="tier-desc">Better than nothing</div>
        </div>
      </div>
    </div>
  </div>
  <div class="content-area">
    <div class="desc">
      Not all productivity methods are created equal.
    </div>
  </div>
</div>
</body>
</html>
