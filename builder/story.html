<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<script src="gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f4f4f6;color:#1a1a2e;font-family:'Satoshi',system-ui,sans-serif;font-size:30px}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#f4f4f6}
.clip{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.s1{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:50px 80px;overflow-y:auto;gap:20px}
.s1h{display:flex;align-items:center;gap:10px;font-size:30px;color:#f59e0b;letter-spacing:3px;text-transform:uppercase;font-weight:700;background:rgba(245,158,11,.08);padding:8px 20px;border-radius:100px}
.s1h svg{width:26px;height:26px;stroke:#f59e0b;stroke-width:1.5;fill:none}
.shook{font-size:48px;font-weight:800;color:#1a1a2e;text-align:center;line-height:1.15;letter-spacing:-1px}
.s1c{display:flex;flex-direction:column;align-items:center;gap:16px}
.s1p{font-size:32px;color:#475569;text-align:center;line-height:1.5;max-width:720px;font-weight:400}
.s1d{font-size:30px;color:#64748b;text-align:center;max-width:720px;font-weight:400}
.s2{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:0 60px;background:#fff}
.s2t{font-size:44px;font-weight:800;color:#1a1a2e;text-align:center}
.s2s{font-size:30px;color:#94a3b8;margin-top:12px;font-weight:400}
</style>
</head>
<body>
<div id="root" data-composition-id="story" data-start="0" data-width="1080" data-height="1920" data-duration="15">
<section class="clip" data-start="0" data-duration="10" data-track-index="1">
<div class="s1">
  <div class="s1h" id="sl"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>{{title_upper}}</div>
  <div class="shook" id="sh">{{hook}}</div>
  <div class="s1c">
{{#each opening}}
<div class="s1p" id="sp-{{@index}}">{{.}}</div>
{{/each}}
  </div>
  <div class="s1d" id="sd">{{description}}</div>
</div>
</section>
<section class="clip" data-start="10" data-duration="5" data-track-index="1">
<div class="s2">
  <div class="s2t" id="s2t">{{follow}}</div>
  <div class="s2s" id="s2s">{{footer}}</div>
</div>
</section>
</div>
<script>
window.__timelines=window.__timelines||{}
var tl=gsap.timeline({paused:true})
tl.from('#sl',{y:-15,opacity:0,scale:.9,duration:.5,ease:'power2.out'},0)
tl.from('#sh',{y:30,opacity:0,duration:.8,ease:'power3.out'},.2)
var np=document.querySelectorAll('.s1p').length
tl.from('.s1p',{y:20,opacity:0,stagger:.15,duration:.55,ease:'power2.out'},.8)
tl.from('#sd',{y:15,opacity:0,duration:.5,ease:'power2.out'},.8+np*.15+.1)
tl.from('#s2t',{y:25,opacity:0,duration:.7,ease:'power2.out'},10.2)
tl.from('#s2s',{opacity:0,duration:.5,ease:'power2.out'},10.7)
window.__timelines['story']=tl
</script>
</body>
</html>
