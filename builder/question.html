<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<script src="gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f4f4f6;color:#1a1a2e;font-family:'Satoshi',system-ui,sans-serif;font-size:30px}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#f4f4f6}
.clip{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.s1{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:50px 80px;overflow-y:auto;gap:20px}
.s1h{display:flex;align-items:center;gap:10px;font-size:30px;color:#ec4899;letter-spacing:3px;text-transform:uppercase;font-weight:700;background:rgba(236,72,153,.08);padding:8px 20px;border-radius:100px}
.s1h svg{width:26px;height:26px;stroke:#ec4899;stroke-width:1.5;fill:none}
.s1q{font-size:40px;font-weight:800;color:#1a1a2e;line-height:1.25;text-align:center;max-width:720px;letter-spacing:-.5px}
.s1c{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:720px}
.oc{display:flex;align-items:center;gap:16px;background:#fff;border-radius:16px;padding:16px 20px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.04)}
.oc svg{width:34px;height:34px;min-width:34px;stroke:#ec4899;stroke-width:1.5;fill:none}
.ot{font-size:32px;color:#475569;line-height:1.35;flex:1;font-weight:400}
.s1d{font-size:30px;color:#94a3b8;text-align:center;max-width:720px;font-weight:400}
.s2{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:0 60px;background:#fff}
.s2t{font-size:44px;font-weight:800;color:#1a1a2e;text-align:center}
.s2s{font-size:30px;color:#94a3b8;margin-top:12px;font-weight:400}
</style>
</head>
<body>
<div id="root" data-composition-id="question" data-start="0" data-width="1080" data-height="1920" data-duration="15">
<section class="clip" data-start="0" data-duration="10" data-track-index="1">
<div class="s1">
  <div class="s1h" id="s1h"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>{{label}}</div>
  <div class="s1q" id="qq">{{title}}</div>
  <div class="s1c">
{{#each options}}
<div class="oc" id="op-{{@index}}"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg><div class="ot">{{text}}</div></div>
{{/each}}
  </div>
  <div class="s1d" id="sd">{{description}}</div>
</div>
</section>
<section class="clip" data-start="10" data-duration="5" data-track-index="1">
<div class="s2">
  <div class="s2t" id="s2t">{{follow}}</div>
  <div class="s2s" id="s2s">{{footer}}</div>
</div>
</section>
</div>
<script>
window.__timelines=window.__timelines||{}
var tl=gsap.timeline({paused:true})
tl.from('#s1h',{y:-15,opacity:0,scale:.9,duration:.5,ease:'power2.out'},0)
tl.from('#qq',{y:20,opacity:0,duration:.6,ease:'power2.out'},.2)
tl.from('.oc',{y:20,opacity:0,stagger:.1,duration:.45,ease:'power2.out'},.6)
tl.from('#sd',{y:10,opacity:0,duration:.5,ease:'power2.out'},.6+.1*4+.1)
tl.from('#s2t',{y:25,opacity:0,duration:.7,ease:'power2.out'},10.2)
tl.from('#s2s',{opacity:0,duration:.5,ease:'power2.out'},10.7)
window.__timelines['question']=tl
</script>
</body>
</html>
