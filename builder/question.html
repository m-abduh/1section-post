<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<script src="gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#fff;font-family:'NS',system-ui,sans-serif;font-size:40px}
@font-face{font-family:'NS';src:url('../fonts/NotoSans-Regular-Complete.ttf')format('truetype');font-weight:400}
@font-face{font-family:'NS';src:url('../fonts/NotoSans-Bold-Complete.ttf')format('truetype');font-weight:700}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#050505}
.clip{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.s1{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:50px 80px;overflow-y:auto;gap:20px}
.s1h{font-size:32px;color:rgba(236,72,153,.35);letter-spacing:6px;text-transform:uppercase;font-weight:400;margin-bottom:2px}
.s1q{font-size:38px;font-weight:700;color:#f0f0f0;line-height:1.3;margin-bottom:4px;text-align:center;max-width:760px;letter-spacing:.5px}
.s1c{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%;max-width:620px;margin:4px 0}
.oc{display:flex;align-items:center;gap:20px;background:linear-gradient(135deg,rgba(255,255,255,.03),rgba(255,255,255,.01));border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:14px 18px;width:100%}
.ob{width:34px;height:34px;min-width:34px;border-radius:50%;background:linear-gradient(135deg,rgba(236,72,153,.12),rgba(236,72,153,.03));border:1px solid rgba(236,72,153,.3);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#ec4899}
.ot{font-size:30px;color:#e0e0e0;line-height:1.35;flex:1;font-weight:300}
.s1d{font-size:28px;color:rgba(255,255,255,.3);text-align:center;max-width:660px;font-weight:300}
.s2{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:0 60px}
.s2t{font-size:44px;font-weight:700;color:#fff;text-align:center;letter-spacing:1px}
.s2s{font-size:30px;color:rgba(255,255,255,.3);margin-top:10px;letter-spacing:2px}
</style>
</head>
<body>
<div id="root" data-composition-id="question" data-start="0" data-width="1080" data-height="1920" data-duration="15">

<section class="clip" data-start="0" data-duration="10" data-track-index="1">
<div class="s1">
  <div class="s1h" id="s1h">{{label}}</div>
  <div class="s1q" id="qq">{{title}}</div>
  <div class="s1c">
{{#each options}}
<div class="oc" id="op-{{@index}}">
  <div class="ob">{{label}}</div>
  <div class="ot">{{text}}</div>
</div>
{{/each}}
  </div>
  <div class="s1d" id="sd">{{description}}</div>
</div>
</section>

<section class="clip" data-start="10" data-duration="5" data-track-index="1">
<div class="s2">
  <div class="s2t" id="s2t">{{follow}}</div>
  <div class="s2s" id="s2s">{{footer}}</div>
</div>
</section>

</div>

<script>
window.__timelines=window.__timelines||{}
var tl=gsap.timeline({paused:true})
tl.from('#s1h',{y:-15,opacity:0,duration:.5,ease:'power2.out'},0)
tl.from('#qq',{y:20,opacity:0,duration:.6,ease:'power2.out'},.25)
tl.from('.oc',{y:20,opacity:0,stagger:.1,duration:.45,ease:'back.out(1.2)'},.65)
tl.from('.ob',{scale:0,stagger:.1,duration:.35,ease:'back.out(2)'},.65)
tl.from('#sd',{y:10,opacity:0,duration:.5,ease:'power2.out'},.65+.1*4+.1)
tl.from('#s2t',{y:25,opacity:0,duration:.7,ease:'power2.out'},10.2)
tl.from('#s2s',{opacity:0,duration:.5,ease:'power2.out'},10.7)
window.__timelines['question']=tl
</script>
</body>
</html>
