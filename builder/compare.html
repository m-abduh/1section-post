<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<script src="gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
body{font-family:'Satoshi',system-ui,sans-serif;background:#faf8f5;color:#1a1a1a}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#faf8f5}
.clip{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:24px;box-shadow:0 8px 40px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.02);padding:50px 70px;width:100%;height:100%;display:flex;flex-direction:column}
:root{--accent:#c49a4a}
.eyebrow-row{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.eyebrow-accent{font-size:26px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--accent)}
.eyebrow-line{flex:1;height:2px;background:rgba(0,0,0,.06)}
.title{font-size:44px;font-weight:800;line-height:1.25;letter-spacing:-1px;color:var(--accent);margin-bottom:36px}
.visual-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.content-area{margin-top:20px}
.desc{font-size:26px;color:#c0c0c0;line-height:1.4}
.comp-wrap{display:flex;flex-direction:column;max-width:680px;width:100%}
.comp-headers{display:flex;margin-bottom:16px;padding:0 20px}
.comp-h-before{flex:1;font-size:18px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#bbb}
.comp-h-after{flex:1;font-size:18px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent);text-align:right}
.comp-row{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid rgba(0,0,0,.04)}
.comp-row:last-child{border:0}
.comp-before{flex:1;font-size:26px;color:#bbb;font-weight:400;padding-right:20px}
.comp-after{flex:1;font-size:26px;color:#1a1a1a;font-weight:600;text-align:right;padding-left:20px}
.s2{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:0 60px;background:#fff}
.s2t{font-size:44px;font-weight:800;color:#1a1a1a;text-align:center}
.s2s{font-size:26px;color:#c0c0c0;margin-top:12px}
</style>
</head>
<body>
<div id="root" data-composition-id="compare" data-start="0" data-width="1080" data-height="1920" data-duration="15">
<section class="clip" data-start="0" data-duration="10" data-track-index="1">
  <div class="card">
    <div class="eyebrow-row">
      <span class="eyebrow-accent">Side by side</span>
      <div class="eyebrow-line"></div>
    </div>
    <div class="visual-area">
      <div class="title" style="margin-bottom:36px">{{title}}</div>
      <div class="comp-wrap">
        <div class="comp-headers">
          <div class="comp-h-before">Before</div>
          <div class="comp-h-after">After</div>
        </div>
{{#each pairs}}
        <div class="comp-row" id="cr-{{@index}}">
          <div class="comp-before" id="cb-{{@index}}">{{left}}</div>
          <div class="comp-after" id="ca-{{@index}}">{{right}}</div>
        </div>
{{/each}}
      </div>
    </div>
    <div class="content-area">
      <div class="desc" id="sd">{{description}}</div>
    </div>
  </div>
</section>
<section class="clip" data-start="10" data-duration="5" data-track-index="1">
<div class="s2">
  <div class="s2t" id="s2t">{{follow}}</div>
  <div class="s2s" id="s2s">{{footer}}</div>
</div>
</section>
</div>
<script>
window.__timelines=window.__timelines||{}
var tl=gsap.timeline({paused:true,defaults:{ease:'power3.out'}})
var n=document.querySelectorAll('.comp-row').length
tl.set('.eyebrow-row,.comp-wrap,.content-area',{opacity:0},0)
tl.fromTo('.title',{opacity:0,scale:1.3},{opacity:1,scale:1.3,duration:.35,ease:'power2.out'},0)
tl.to('.title',{scale:1,duration:.5,ease:'power3.out'},.3)
tl.fromTo('.eyebrow-row',{x:-30,opacity:0},{x:0,opacity:1,duration:.35},.3)
tl.fromTo('.comp-headers',{opacity:0},{opacity:1,duration:.4},.65)
tl.fromTo('.comp-row',{y:20,opacity:0},{y:0,opacity:1,stagger:.08,duration:.5},.85)
tl.fromTo('#sd',{y:15,opacity:0},{y:0,opacity:1,duration:.45},.85+n*.08+.05)
tl.fromTo('#s2t',{y:30,opacity:0},{y:0,opacity:1,duration:.65},10.2)
tl.fromTo('#s2s',{opacity:0},{opacity:1,duration:.5},10.65)
window.__timelines['compare']=tl
</script>
</body>
</html>
