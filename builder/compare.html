<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<script src="gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f4f4f6;color:#1a1a2e;font-family:'Satoshi',system-ui,sans-serif;font-size:30px}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#f4f4f6}
.clip{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.s1{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:50px 80px;overflow-y:auto;gap:12px}
.s1h{display:flex;align-items:center;gap:10px;font-size:30px;color:#f59e0b;letter-spacing:3px;text-transform:uppercase;font-weight:700;background:rgba(245,158,11,.08);padding:8px 20px;border-radius:100px}
.s1h svg{width:26px;height:26px;stroke:#f59e0b;stroke-width:1.5;fill:none}
.s1v{font-size:80px;font-weight:900;background:linear-gradient(135deg,#f97316,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:4px;letter-spacing:-2px;text-align:center}
.s1c{width:100%;max-width:720px}
.sh2{display:flex;width:100%;margin-bottom:10px;padding:0 6px}
.sh2l,.sh2r{width:50%;font-size:30px;text-transform:uppercase;letter-spacing:3px;color:#94a3b8;font-weight:700}
.sh2r{text-align:right}
.s2d{position:absolute;left:50%;top:205px;bottom:50px;width:1px;background:linear-gradient(180deg,transparent,#f59e0b,transparent);transform:translateX(-50%);z-index:0}
.prc{width:100%;max-width:720px;position:relative;z-index:1}
.pr{display:flex;width:100%;margin-bottom:10px;gap:6px}
.pl{width:50%;text-align:right;padding-right:16px;color:#64748b;font-size:34px;line-height:1.35;font-weight:400}
.prr{width:50%;text-align:left;padding-left:16px;color:#1a1a2e;font-size:34px;line-height:1.35;font-weight:700}
.s1d{font-size:30px;color:#64748b;text-align:center;max-width:720px;font-weight:400}
.s2{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:0 60px;background:#fff}
.s2t{font-size:44px;font-weight:800;color:#1a1a2e;text-align:center}
.s2s{font-size:30px;color:#94a3b8;margin-top:12px;font-weight:400}
</style>
</head>
<body>
<div id="root" data-composition-id="compare" data-start="0" data-width="1080" data-height="1920" data-duration="15">
<svg xmlns="http://www.w3.org/2000/svg" style="display:none"><defs><linearGradient id="vsG" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient></defs></svg>
<section class="clip" data-start="0" data-duration="10" data-track-index="1">
<div class="s1">
  <div class="s1h" id="s1h"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></svg>{{title}}</div>
  <div class="s1v" id="sv">VS</div>
  <div class="s1c">
    <div class="sh2"><div class="sh2l">Before</div><div class="sh2r">After</div></div>
    <div class="s2d" id="sdiv"></div>
    <div class="prc">
{{#each pairs}}
<div class="pr" id="pr-{{@index}}">
  <div class="pl">{{left}}</div>
  <div class="prr">{{right}}</div>
</div>
{{/each}}
    </div>
  </div>
  <div class="s1d" id="sd">{{description}}</div>
</div>
</section>
<section class="clip" data-start="10" data-duration="5" data-track-index="1">
<div class="s2">
  <div class="s2t" id="s2t">{{follow}}</div>
  <div class="s2s" id="s2s">{{footer}}</div>
</div>
</section>
</div>
<script>
window.__timelines=window.__timelines||{}
var tl=gsap.timeline({paused:true})
tl.from('#s1h',{y:-15,opacity:0,scale:.9,duration:.5,ease:'power2.out'},0)
tl.from('#sv',{scale:1.3,opacity:0,duration:.7,ease:'back.out(2)'},.2)
tl.from('.sh2',{opacity:0,duration:.3},.65)
tl.from('.pr',{y:15,opacity:0,stagger:.08,duration:.45,ease:'power2.out'},.85)
tl.from('#sd',{y:10,opacity:0,duration:.4,ease:'power2.out'},.85+.08*5+.1)
tl.from('#s2t',{y:25,opacity:0,duration:.7,ease:'power2.out'},10.2)
tl.from('#s2s',{opacity:0,duration:.5,ease:'power2.out'},10.7)
window.__timelines['compare']=tl
</script>
</body>
</html>
