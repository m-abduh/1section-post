<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<script src="gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#fff;font-family:'NS',system-ui,sans-serif;font-size:40px}
@font-face{font-family:'NS';src:url('../fonts/NotoSans-Regular-Complete.ttf')format('truetype');font-weight:400}
@font-face{font-family:'NS';src:url('../fonts/NotoSans-Bold-Complete.ttf')format('truetype');font-weight:700}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#050505}
.clip{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.s1{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:50px 80px;overflow-y:auto;gap:20px}
.s1h{font-size:32px;color:rgba(245,158,11,.4);letter-spacing:6px;text-transform:uppercase;font-weight:400;margin-bottom:2px}
.s1v{font-size:90px;font-weight:900;background:linear-gradient(135deg,#f97316 0%,#f59e0b 50%,#d97706 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:4px;filter:drop-shadow(0 4px 24px rgba(245,158,11,.15))}
.s1c{width:100%;max-width:680px;margin:4px 0}
.s2h{display:flex;width:100%;margin-bottom:8px;padding:0 4px}
.s2hl,.s2hr{width:50%;font-size:22px;text-transform:uppercase;letter-spacing:4px;color:rgba(255,255,255,.15);font-weight:600}
.s2hr{text-align:right}
.s2d{position:absolute;left:50%;top:195px;bottom:50px;width:1px;background:linear-gradient(180deg,transparent,rgba(245,158,11,.25),transparent);transform:translateX(-50%);z-index:0}
.prc{width:100%;max-width:680px;position:relative;z-index:1}
.pr{display:flex;width:100%;margin-bottom:8px;gap:20px}
.pl{width:50%;text-align:right;padding-right:14px;color:rgba(255,255,255,.35);font-size:32px;line-height:1.35;font-weight:300}
.prr{width:50%;text-align:left;padding-left:14px;color:#f0f0f0;font-size:32px;line-height:1.35;font-weight:400}
.s1d{font-size:30px;color:rgba(255,255,255,.25);text-align:center;max-width:680px;font-weight:300}
.s2{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:0 60px}
.s2t{font-size:44px;font-weight:700;color:#fff;text-align:center;letter-spacing:1px}
.s2s{font-size:30px;color:rgba(255,255,255,.3);margin-top:10px;letter-spacing:2px}
</style>
</head>
<body>
<div id="root" data-composition-id="compare" data-start="0" data-width="1080" data-height="1920" data-duration="15">

<section class="clip" data-start="0" data-duration="10" data-track-index="1">
<div class="s1">
  <div class="s1h" id="s1h">{{title}}</div>
  <div class="s1v" id="sv">VS</div>
  <div class="s1c">
    <div class="s2h"><div class="s2hl">Before</div><div class="s2hr">After</div></div>
    <div class="s2d" id="sdiv"></div>
    <div class="prc">
{{#each pairs}}
<div class="pr" id="pr-{{@index}}">
  <div class="pl">{{left}}</div>
  <div class="prr">{{right}}</div>
</div>
{{/each}}
    </div>
  </div>
  <div class="s1d" id="sd"></div>
</div>
</section>

<section class="clip" data-start="10" data-duration="5" data-track-index="1">
<div class="s2">
  <div class="s2t" id="s2t">{{follow}}</div>
  <div class="s2s" id="s2s">{{footer}}</div>
</div>
</section>

</div>

<script>
window.__timelines=window.__timelines||{}
var tl=gsap.timeline({paused:true})
tl.from('#s1h',{y:-15,opacity:0,duration:.5,ease:'power2.out'},0)
tl.from('#sv',{scale:1.4,opacity:0,duration:.7,ease:'back.out(2)'},.25)
tl.from('.s2h',{opacity:0,duration:.4},.7)
tl.from('.pr',{y:15,opacity:0,stagger:.08,duration:.45,ease:'power2.out'},.9)
tl.from('#sd',{y:10,opacity:0,duration:.4,ease:'power2.out'},.9+.08*5+.1)
tl.from('#s2t',{y:25,opacity:0,duration:.7,ease:'power2.out'},10.2)
tl.from('#s2s',{opacity:0,duration:.5,ease:'power2.out'},10.7)
window.__timelines['compare']=tl
</script>
</body>
</html>
