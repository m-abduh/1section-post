<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<script src="gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
body{font-family:'Satoshi',system-ui,sans-serif;background:#faf8f5;color:#1a1a1a}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#faf8f5}
.clip{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:24px;box-shadow:0 8px 40px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.02);padding:50px 70px;width:100%;height:100%;display:flex;flex-direction:column}
:root{--accent:#c4665d;--accent-myth:#c4665d;--accent-fact:#5d9e7a}
.intro-card{align-items:center;justify-content:center}
.brand{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;z-index:1}
.brand-icon{width:72px;height:72px;border-radius:18px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:#fff;margin-bottom:8px}
.brand-name{font-size:72px;font-weight:800;letter-spacing:-2px;color:#1a1a1a;line-height:1}
.brand-name em{font-style:normal;color:var(--accent)}
.brand-line{width:60px;height:3px;background:var(--accent);border-radius:2px;margin:20px 0}
.intro-title{font-size:52px;font-weight:800;line-height:1.2;letter-spacing:-1px;color:#1a1a1a;text-align:center;max-width:720px;margin-top:10px}
.intro-desc{font-size:26px;color:#c0c0c0;line-height:1.4;text-align:center;max-width:600px;margin-top:8px}
.brand-tag{font-size:16px;color:#ccc;letter-spacing:3px;text-transform:uppercase;margin-top:24px}
.detail-card{padding:40px 60px;justify-content:center}
.eyebrow-accent{font-size:24px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.title{font-size:40px;font-weight:800;line-height:1.25;letter-spacing:-1px;color:var(--accent);margin-bottom:16px}
.visual-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;min-height:0}
.desc{font-size:24px;color:#c0c0c0;line-height:1.4;margin-top:16px}
.mf-wrap{display:flex;flex-direction:column;gap:0;max-width:580px;width:100%}
.mf-card{padding:22px 26px;border-radius:16px}
.myth-card{background:rgba(196,102,93,.05)}
.fact-card{background:rgba(93,158,122,.05)}
.mf-top{display:flex;align-items:flex-start;gap:12px}
.mf-icon{font-size:28px;line-height:1;margin-top:2px;min-width:28px}
.myth-card .mf-icon{color:var(--accent-myth)}
.fact-card .mf-icon{color:var(--accent-fact)}
.mf-text{font-size:26px;line-height:1.45}
.myth-card .mf-text{color:#777;font-weight:400;text-decoration:line-through}
.fact-card .mf-text{color:#1a1a1a;font-weight:600}
.mf-line{display:flex;align-items:center;justify-content:center;height:24px}
.mf-line::before{content:'';width:2px;height:100%;background:rgba(0,0,0,.06)}
.cta-card{align-items:center;justify-content:center}
.cta-icon{width:56px;height:56px;border-radius:14px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fff;margin-bottom:6px}
.cta-name{font-size:48px;font-weight:800;letter-spacing:-1px;color:#1a1a1a;line-height:1}
.cta-name em{font-style:normal;color:var(--accent)}
.cta-line{width:40px;height:3px;background:var(--accent);border-radius:2px;margin:14px 0}
.cta-text{font-size:36px;font-weight:700;color:#1a1a1a;text-align:center;max-width:600px}
.cta-tag{font-size:18px;color:#ccc;letter-spacing:2px;text-transform:uppercase;margin-top:12px}
</style>
</head>
<body>
<div id="root" data-composition-id="mythfact" data-start="0" data-width="1080" data-height="1920" data-duration="20">
<section class="clip" data-start="0" data-duration="8" data-track-index="1">
  <div class="card intro-card">
    <div class="brand">
      <div class="brand-icon" id="bi">1s</div>
      <div class="brand-name" id="bn"><em>1</em>section</div>
      <div class="brand-line" id="bl"></div>
      <div class="intro-title" id="bt">{{title}}</div>
      <div class="intro-desc" id="bd">{{description}}</div>
      <div class="brand-tag" id="bg">Ideas that stick</div>
    </div>
  </div>
</section>
<section class="clip" data-start="8" data-duration="9" data-track-index="1">
  <div class="card detail-card">
    <div class="visual-area">
      <span class="eyebrow-accent" id="oe">Don't be fooled</span>
      <div class="title" id="ot">{{title}}</div>
      <div class="mf-wrap">
        <div class="mf-card myth-card" id="o1">
          <div class="mf-top">
            <span class="mf-icon">&#10005;</span>
            <div class="mf-text">{{myth}}</div>
          </div>
        </div>
        <div class="mf-line" id="o2"></div>
        <div class="mf-card fact-card" id="o3">
          <div class="mf-top">
            <span class="mf-icon">&#10003;</span>
            <div class="mf-text">{{fact}}</div>
          </div>
        </div>
      </div>
      <div class="desc" id="o4">{{description}}</div>
    </div>
  </div>
</section>
<section class="clip" data-start="17" data-duration="3" data-track-index="1">
  <div class="card cta-card">
    <div class="brand">
      <div class="cta-icon" id="ci">1s</div>
      <div class="cta-name" id="cn"><em>1</em>section</div>
      <div class="cta-line" id="cl"></div>
      <div class="cta-text" id="ct">{{follow}}</div>
      <div class="cta-tag" id="cg">{{footer}}</div>
    </div>
  </div>
</section>
</div>
<script>
window.__timelines=window.__timelines||{}
var tl=gsap.timeline({paused:true,defaults:{ease:'power3.out'}})
tl.fromTo('#bi',{scale:.5,opacity:0},{scale:1,opacity:1,duration:.5,ease:'back.out(1.4)'},0)
tl.fromTo('#bn',{y:20,opacity:0},{y:0,opacity:1,duration:.55},.35)
tl.fromTo('#bl',{scaleX:0},{scaleX:1,transformOrigin:'50% 0%',duration:.4},.7)
tl.fromTo('#bt',{y:30,opacity:0},{y:0,opacity:1,duration:.6},1)
tl.fromTo('#bd',{y:20,opacity:0},{y:0,opacity:1,duration:.5},1.4)
tl.fromTo('#bg',{opacity:0},{opacity:1,duration:.4},1.75)
tl.fromTo('#oe',{x:-25,opacity:0},{x:0,opacity:1,duration:.35},8.2)
tl.fromTo('#ot',{y:20,opacity:0},{y:0,opacity:1,duration:.45},8.45)
tl.fromTo('#o1',{x:-30,opacity:0},{x:0,opacity:1,duration:.4},8.7)
tl.fromTo('#o2',{scaleY:0},{scaleY:1,transformOrigin:'50% 0%',duration:.25},9.0)
tl.fromTo('#o3',{x:30,opacity:0},{x:0,opacity:1,duration:.4},9.1)
tl.fromTo('#o4',{y:15,opacity:0},{y:0,opacity:1,duration:.3},9.4)
tl.fromTo('#ci',{scale:.5,opacity:0},{scale:1,opacity:1,duration:.4,ease:'back.out(1.4)'},17)
tl.fromTo('#cn',{y:15,opacity:0},{y:0,opacity:1,duration:.4},17.25)
tl.fromTo('#cl',{scaleX:0},{scaleX:1,transformOrigin:'50% 0%',duration:.3},17.55)
tl.fromTo('#ct',{y:20,opacity:0},{y:0,opacity:1,duration:.45},17.75)
tl.fromTo('#cg',{opacity:0},{opacity:1,duration:.3},18.1)
window.__timelines['mythfact']=tl
</script>
</body>
</html>
