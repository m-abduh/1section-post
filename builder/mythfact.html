<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<script src="gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
body{font-family:'Satoshi',system-ui,sans-serif;background:#faf8f5;color:#1a1a1a}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#faf8f5}
.clip{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:24px;box-shadow:0 8px 40px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.02);padding:50px 70px;width:100%;height:100%;display:flex;flex-direction:column}
:root{--accent:#b08a5c;--accent-myth:#c4665d;--accent-fact:#5d9e7a}
.intro-card{align-items:center;justify-content:center}
.brand{display:flex;flex-direction:column;align-items:center;gap:0}
.intro-title{font-size:54px;font-weight:800;line-height:1.18;letter-spacing:-2px;color:#1a1a1a;text-align:center;max-width:700px;margin-top:6px}
.intro-desc{font-size:26px;color:#b0b0b0;line-height:1.4;text-align:center;max-width:560px;margin-top:6px}
.detail-card{padding:40px 60px;justify-content:center}

.title{font-size:40px;font-weight:800;line-height:1.25;letter-spacing:-1px;color:var(--accent);margin-bottom:16px}
.visual-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;min-height:0}
.desc{font-size:24px;color:#c0c0c0;line-height:1.4;margin-top:16px}
.mf-wrap{display:flex;flex-direction:column;gap:0;max-width:580px;width:100%}
.mf-card{padding:22px 26px;border-radius:16px}
.myth-card{background:rgba(196,102,93,.05)}
.fact-card{background:rgba(93,158,122,.05)}
.mf-top{display:flex;align-items:flex-start;gap:12px}
.mf-icon{font-size:28px;line-height:1;margin-top:2px;min-width:28px}
.myth-card .mf-icon{color:var(--accent-myth)}
.fact-card .mf-icon{color:var(--accent-fact)}
.mf-text{font-size:26px;line-height:1.45}
.myth-card .mf-text{color:#777;font-weight:400;text-decoration:line-through}
.fact-card .mf-text{color:#1a1a1a;font-weight:600}
.mf-pair{display:flex;flex-direction:column;gap:2px}
.mf-pair+.mf-pair{margin-top:10px;padding-top:10px;border-top:1px solid rgba(0,0,0,.04)}
.cta-card{align-items:center;justify-content:center}
.intro-icon{width:72px;height:72px;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.intro-icon .ti{font-size:60px;color:var(--accent)}
.intro-hline{width:40px;height:2px;background:#1a1a1a;border-radius:2px;margin:8px 0 12px 0;opacity:.15}
.intro-divider{width:32px;height:2px;background:#e8e4de;border-radius:2px;margin:18px 0}
.intro-domain{font-size:13px;color:#d0d0d0;letter-spacing:4px;text-transform:uppercase;font-weight:500}
.cta-cta{font-size:40px;font-weight:700;color:#1a1a1a;text-align:center;max-width:600px;line-height:1.35;margin-bottom:20px}
.cta-tag{font-size:14px;color:#d0d0d0;letter-spacing:4px;text-transform:uppercase;font-weight:500}
</style>
<link rel="stylesheet" href="tabler-icons.min.css">
</head>
<body>
<div id="root" data-composition-id="mythfact" data-start="0" data-width="1080" data-height="1920" data-duration="12">
<section class="clip" data-start="0" data-duration="3" data-track-index="1">
  <div class="card intro-card">
    <div class="brand">
      <div class="intro-icon" id="ii"><i class="ti {{icon}}"></i></div>
      <div class="intro-hline" id="ih"></div>
      <div class="intro-title" id="bt">{{title}}</div>
      <div class="intro-desc" id="bd">{{description}}</div>
      <div class="intro-divider" id="iv"></div>
      <div class="intro-domain" id="id">1section.com</div>
    </div>
  </div>
</section>
<section class="clip" data-start="3" data-duration="6" data-track-index="1">
  <div class="card detail-card">
    <div class="visual-area">
      <div class="title" id="ot">{{title}}</div>
      <div class="mf-wrap">
{{#each pairs}}
        <div class="mf-pair" id="op-{{@index}}">
          <div class="mf-card myth-card">
            <div class="mf-top">
              <span class="mf-icon">&#10005;</span>
              <div class="mf-text">{{myth}}</div>
            </div>
          </div>
          <div class="mf-card fact-card">
            <div class="mf-top">
              <span class="mf-icon">&#10003;</span>
              <div class="mf-text">{{fact}}</div>
            </div>
          </div>
        </div>
{{/each}}
      </div>
      <div class="desc" id="o4">{{description}}</div>
    </div>
  </div>
</section>
<section class="clip" data-start="9" data-duration="3" data-track-index="1">
  <div class="card cta-card">
    <div class="brand">
      <div class="cta-cta" id="ct">{{follow_call}}</div>
      <div class="cta-tag" id="cg">{{footer}}</div>
    </div>
  </div>
</section>
</div>
<script>
window.__timelines=window.__timelines||{}
var tl=gsap.timeline({paused:true,defaults:{ease:'power3.out'}})
tl.fromTo('#ii',{scale:.5,opacity:0,rotation:-15},{scale:1,opacity:1,rotation:0,duration:.45,ease:'back.out(1.5)'},0)
tl.fromTo('#ih',{scaleX:0},{scaleX:1,transformOrigin:'50% 0%',duration:.3},.2)
tl.fromTo('#bt',{scale:.94},{scale:1,letterSpacing:'-1.5',color:'var(--accent)',duration:.55,ease:'power2.out'},.25)
tl.fromTo('#bd',{y:18,opacity:0},{y:0,opacity:1,duration:.45},.38)
tl.fromTo('#iv',{scaleX:0},{scaleX:1,transformOrigin:'50% 0%',duration:.35},.55)
tl.fromTo('#id',{y:12,opacity:0},{y:0,opacity:1,duration:.3},.65)
tl.to('#ii,#ih,#bt,#bd,#iv,#id',{opacity:0,y:-15,duration:.35,stagger:.03,ease:'power3.in'},2.3)
tl.fromTo('#ot',{y:20,opacity:0},{y:0,opacity:1,duration:.45},3.45)
var np=document.querySelectorAll('.mf-pair').length
tl.fromTo('.mf-pair',{x:-30,opacity:0},{x:0,opacity:1,stagger:.12,duration:.45},3.7)
tl.fromTo('#o4',{y:15,opacity:0},{y:0,opacity:1,duration:.3},3.7+np*.12+.05)
tl.to('#ot,.mf-pair,#o4',{opacity:0,y:-15,duration:.3,stagger:.03,ease:'power3.in'},8.4)
tl.fromTo('#ct',{y:18,opacity:0},{y:0,opacity:1,duration:.35},9)
tl.fromTo('#cg',{opacity:0,y:12},{opacity:1,y:0,duration:.3},9.3)
tl.to('#ct,#cg',{opacity:0,y:-15,duration:.3,stagger:.05,ease:'power3.in'},11.4)
window.__timelines['mythfact']=tl
</script>
</body>
</html>
