<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<script src="gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#fff;font-family:'NS',system-ui,sans-serif;font-size:40px}
@font-face{font-family:'NS';src:url('../fonts/NotoSans-Regular-Complete.ttf')format('truetype');font-weight:400}
@font-face{font-family:'NS';src:url('../fonts/NotoSans-Bold-Complete.ttf')format('truetype');font-weight:700}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#050505}
.clip{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.s1{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:50px 80px;overflow-y:auto;gap:20px}
.s1h{font-size:34px;color:rgba(255,255,255,.25);letter-spacing:6px;text-transform:uppercase;font-weight:400;margin-bottom:4px}
.mc,.fc{border-radius:14px;padding:16px 24px;width:100%;max-width:600px}
.mc{border:1px solid rgba(239,68,68,.15);border-left:4px solid #ef4444}
.fc{border:1px solid rgba(34,197,94,.15);border-left:4px solid #22c55e}
.mcl{font-size:22px;font-weight:700;color:#ef4444;letter-spacing:3px;margin-bottom:4px;text-transform:uppercase}
.fcl{font-size:22px;font-weight:700;color:#22c55e;letter-spacing:3px;margin-bottom:4px;text-transform:uppercase}
.mcb{font-size:34px;color:rgba(255,255,255,.55);line-height:1.35;font-weight:300}
.fcb{font-size:34px;color:#e8e8e8;line-height:1.35;font-weight:400}
.mvs{font-size:24px;color:rgba(255,255,255,.08);letter-spacing:8px;margin:4px 0}
.s1d{font-size:30px;color:rgba(255,255,255,.3);text-align:center;max-width:680px;font-weight:300}
.s2{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:0 60px}
.s2t{font-size:44px;font-weight:700;color:#fff;text-align:center;letter-spacing:1px}
.s2s{font-size:30px;color:rgba(255,255,255,.3);margin-top:10px;letter-spacing:2px}
</style>
</head>
<body>
<div id="root" data-composition-id="mythfact" data-start="0" data-width="1080" data-height="1920" data-duration="15">

<section class="clip" data-start="0" data-duration="10" data-track-index="1">
<div class="s1">
  <div class="s1h" id="s1h">{{title}}</div>
  <div class="mc" id="cm">
    <div class="mcl">{{mythLabel}}</div>
    <div class="mcb">{{myth}}</div>
  </div>
  <div class="mvs">&#8593; vs &#8595;</div>
  <div class="fc" id="cf">
    <div class="fcl">{{factLabel}}</div>
    <div class="fcb">{{fact}}</div>
  </div>
  <div class="s1d" id="sd">{{description}}</div>
</div>
</section>

<section class="clip" data-start="10" data-duration="5" data-track-index="1">
<div class="s2">
  <div class="s2t" id="s2t">{{follow}}</div>
  <div class="s2s" id="s2s">{{footer}}</div>
</div>
</section>

</div>

<script>
window.__timelines=window.__timelines||{}
var tl=gsap.timeline({paused:true})
tl.from('#s1h',{y:-15,opacity:0,duration:.5,ease:'power2.out'},0)
tl.from('#cm',{x:-70,rotation:-5,opacity:0,duration:.55,ease:'power3.out'},.3)
tl.from('.mvs',{opacity:0,scale:.5,duration:.3},.7)
tl.from('#cf',{x:70,rotation:5,opacity:0,duration:.55,ease:'power3.out'},.9)
tl.from('#sd',{y:15,opacity:0,duration:.5,ease:'power2.out'},1.4)
tl.from('#s2t',{y:25,opacity:0,duration:.7,ease:'power2.out'},10.2)
tl.from('#s2s',{opacity:0,duration:.5,ease:'power2.out'},10.7)
window.__timelines['mythfact']=tl
</script>
</body>
</html>
