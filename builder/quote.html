<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<script src="gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
body{font-family:'Satoshi',system-ui,sans-serif;background:#faf8f5;color:#1a1a1a}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#faf8f5}
.clip{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:24px;box-shadow:0 8px 40px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.02);padding:50px 70px;width:100%;height:100%;display:flex;flex-direction:column}
:root{--accent:#7c5f7e}
.eyebrow-accent{font-size:26px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.title{font-size:44px;font-weight:800;line-height:1.25;letter-spacing:-1px;color:var(--accent);margin-bottom:20px}
.visual-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.desc{font-size:26px;color:#c0c0c0;line-height:1.4;margin-top:24px}
.quote-mark{font-size:120px;font-weight:900;line-height:.6;color:var(--accent);opacity:.12;margin-bottom:-20px}
.quote-text{font-size:48px;font-weight:400;line-height:1.45;max-width:780px;font-style:italic}
.quote-source{font-size:28px;color:var(--accent);font-weight:600;margin-top:16px}
.s2{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:0 60px;background:#fff}
.s2t{font-size:44px;font-weight:800;color:#1a1a1a;text-align:center}
.s2s{font-size:26px;color:#c0c0c0;margin-top:12px}
</style>
</head>
<body>
<div id="root" data-composition-id="quote" data-start="0" data-width="1080" data-height="1920" data-duration="15">
<section class="clip" data-start="0" data-duration="10" data-track-index="1">
  <div class="card">
    <div class="visual-area">
      <span class="eyebrow-accent">Words to live by</span>
      <div class="title">{{title}}</div>
      <div style="display:flex;flex-direction:column;align-items:center">
        <div class="quote-mark">&ldquo;</div>
        <div class="quote-text" id="qt">{{quote_short}}</div>
        <div class="quote-source" id="qs">{{source_display}}</div>
      </div>
      <div class="desc" id="sd">{{description}}</div>
    </div>
  </div>
</section>
<section class="clip" data-start="10" data-duration="5" data-track-index="1">
<div class="s2">
  <div class="s2t" id="s2t">{{follow}}</div>
  <div class="s2s" id="s2s">{{footer}}</div>
</div>
</section>
</div>
<script>
window.__timelines=window.__timelines||{}
var tl=gsap.timeline({paused:true,defaults:{ease:'power3.out'}})
tl.fromTo('.eyebrow-accent',{x:-30,opacity:0},{x:0,opacity:1,duration:.5},0)
tl.fromTo('.title',{y:24,opacity:0},{y:0,opacity:1,duration:.6},.25)
tl.fromTo('.quote-mark',{scale:1.5,opacity:0},{scale:1,opacity:1,duration:.7},.5)
tl.fromTo('#qt',{y:30,opacity:0},{y:0,opacity:1,duration:.7},.7)
tl.fromTo('#qs',{y:15,opacity:0},{y:0,opacity:1,duration:.5},1.1)
tl.fromTo('#sd',{y:15,opacity:0},{y:0,opacity:1,duration:.45},1.35)
tl.fromTo('#s2t',{y:30,opacity:0},{y:0,opacity:1,duration:.65},10.2)
tl.fromTo('#s2s',{opacity:0},{opacity:1,duration:.5},10.65)
window.__timelines['quote']=tl
</script>
</body>
</html>
