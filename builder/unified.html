<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1350">
<script src="gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:'Satoshi';src:url('fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
:root{--box-fill:#4f8cff;--text-color:#ffffff;--badge:#1a1a1a}
body{font-family:'Satoshi',system-ui,sans-serif;background:#f7f5f0;color:#1a1a1a}
#root{position:relative;width:1080px;height:1350px;overflow:hidden;background:#f7f5f0}
#paper{position:absolute;inset:0;opacity:.55;mix-blend-mode:multiply}
.clip{position:absolute;inset:0;display:flex;flex-direction:column;padding:64px 56px}
.hook{font-size:54px;font-weight:800;line-height:1.2;letter-spacing:-1.5px;color:#1a1a1a;max-width:100%;margin-bottom:44px}
.content-box{position:relative;flex:1;display:flex;align-items:center;border-radius:28px;padding:64px 70px;background:var(--box-fill);overflow:hidden}
.content-text{font-size:44px;font-weight:700;line-height:1.4;letter-spacing:-0.5px;color:var(--text-color);text-align:left;width:100%}
.content-text p{margin:0 0 26px;font-weight:700}
.content-text p:last-child{margin-bottom:0}
.content-text strong{font-weight:900}
.content-text em{font-style:italic}
.content-text ul,.content-text ol{margin:4px 0;padding-left:46px}
.content-text li{margin-bottom:18px;line-height:1.38}
.content-text li:last-child{margin-bottom:0}
.content-text blockquote{margin:22px 0 8px;padding:10px 26px;border-left:10px solid rgba(0,0,0,.22);font-weight:900;font-size:38px;line-height:1.3}
.content-text blockquote p{margin:0}
.content-text table{border-collapse:collapse;width:100%;margin:6px 0 18px}
.content-text th,.content-text td{border:2px solid rgba(0,0,0,.2);padding:10px 16px;font-size:32px}
.content-text th{font-weight:900;text-align:left}
.content-text td{font-weight:600}
.content-text hr{border:none;border-top:3px solid rgba(0,0,0,.2);margin:18px 0}
.category-badge{position:absolute;top:36px;right:36px;background:var(--badge);color:#fff;font-size:26px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:14px 26px;border-radius:999px}
.footer{display:flex;align-items:center;justify-content:space-between;margin-top:36px}
.footer-left{display:flex;align-items:baseline;gap:4px;font-size:30px;color:#1a1a1a}
.footer-left .at{font-weight:500;color:#9a978e}
.footer-left .handle{font-weight:800}
.footer-right{font-size:30px;font-weight:700;letter-spacing:1px}
.footer-right .domain{color:#9a978e;font-weight:500}
</style>
</head>
<body>
<div id="root" data-composition-id="unified" data-start="0" data-width="1080" data-height="1350" data-duration="15">
<svg id="paper" xmlns="http://www.w3.org/2000/svg" width="1080" height="1350">
  <defs>
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <rect width="1080" height="1350" filter="url(#n)" opacity="0.6"/>
</svg>
<section class="clip" id="unified-scene" data-start="0" data-duration="15" data-track-index="1">
  <div class="hook">{{hook}}</div>
  <div class="content-box">
    <span class="category-badge">{{category}}</span>
    <div class="content-text">{{content}}</div>
  </div>
  <div class="footer">
    <div class="footer-left"><span class="at">@</span><span class="handle">{{account}}</span></div>
    <div class="footer-right">1section<span class="domain">.com</span></div>
  </div>
</section>
</div>
<script>
window.__timelines=window.__timelines||{}
window.__timelines['unified']=gsap.timeline({paused:true})
</script>
</body>
</html>
