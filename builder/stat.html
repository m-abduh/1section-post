<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<script src="gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f4f4f6;color:#1a1a2e;font-family:'Satoshi',system-ui,sans-serif;font-size:30px}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#f4f4f6}
.clip{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.s1{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:50px 80px;gap:20px}
.s1h{display:flex;align-items:center;gap:10px;font-size:30px;color:#3b82f6;letter-spacing:3px;text-transform:uppercase;font-weight:700;background:rgba(59,130,246,.08);padding:8px 20px;border-radius:100px}
.s1h svg{width:26px;height:26px;stroke:#3b82f6;stroke-width:1.5;fill:none}
.s1n{font-size:220px;font-weight:900;line-height:.8;background:linear-gradient(135deg,#1e293b 30%,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:2px;letter-spacing:-4px}
.s1l{width:100px;height:4px;background:linear-gradient(90deg,#3b82f6,transparent);border-radius:4px}
.s1d{font-size:30px;color:#475569;text-align:center;line-height:1.45;max-width:720px;font-weight:400}
.s1sb{font-size:30px;color:#94a3b8;text-align:center;max-width:720px;line-height:1.4;font-weight:400}
.s2{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:0 60px;background:#fff}
.s2t{font-size:44px;font-weight:800;color:#1a1a2e;text-align:center}
.s2s{font-size:30px;color:#94a3b8;margin-top:12px;font-weight:400}
</style>
</head>
<body>
<div id="root" data-composition-id="stat" data-start="0" data-width="1080" data-height="1920" data-duration="15">
<section class="clip" data-start="0" data-duration="10" data-track-index="1">
<div class="s1">
  <div class="s1h" id="e1"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="m22 7-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/></svg>{{label}}</div>
  <div class="s1n" id="e2">{{stat}}</div>
  <div class="s1l" id="e3"></div>
  <div class="s1d" id="e4">{{desc}}</div>
  <div class="s1sb" id="e5">{{sub}}</div>
</div>
</section>
<section class="clip" data-start="10" data-duration="5" data-track-index="1">
<div class="s2">
  <div class="s2t" id="s2t">{{follow}}</div>
  <div class="s2s" id="s2s">{{footer}}</div>
</div>
</section>
</div>
<script>
window.__timelines=window.__timelines||{}
var tl=gsap.timeline({paused:true})
tl.from('#e1',{y:-15,opacity:0,scale:.9,duration:.5,ease:'power2.out'},0)
tl.from('#e2',{scale:1.2,opacity:0,duration:.8,ease:'power3.out'},.25)
tl.from('#e3',{scaleX:0,transformOrigin:'center',duration:.6,ease:'power2.out'},.85)
tl.from('#e4',{y:20,opacity:0,duration:.6,ease:'power2.out'},1.2)
tl.from('#e5',{y:15,opacity:0,duration:.5,ease:'power2.out'},1.6)
tl.from('#s2t',{y:25,opacity:0,duration:.7,ease:'power2.out'},10.2)
tl.from('#s2s',{opacity:0,duration:.5,ease:'power2.out'},10.7)
window.__timelines['stat']=tl
</script>
</body>
</html>
