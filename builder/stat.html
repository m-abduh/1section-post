<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<script src="gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#fff;font-family:'NS',system-ui,sans-serif;font-size:40px}
@font-face{font-family:'NS';src:url('../fonts/NotoSans-Regular-Complete.ttf')format('truetype');font-weight:400}
@font-face{font-family:'NS';src:url('../fonts/NotoSans-Bold-Complete.ttf')format('truetype');font-weight:700}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#050505}
.clip{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.s1{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:60px 80px;gap:20px}
.s1h{font-size:34px;color:rgba(59,130,246,.5);letter-spacing:6px;text-transform:uppercase;font-weight:400;margin-bottom:4px}
.s1n{font-size:220px;font-weight:700;line-height:.8;background:linear-gradient(135deg,#f0f0f0 0%,#94a3b8 50%,#f0f0f0 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:2px;text-shadow:none;filter:drop-shadow(0 4px 20px rgba(59,130,246,.15))}
.s1l{width:100px;height:1px;background:linear-gradient(90deg,transparent,rgba(59,130,246,.3),transparent);border-radius:2px;margin:4px 0}
.s1d{font-size:32px;color:rgba(255,255,255,.55);text-align:center;line-height:1.5;max-width:700px;font-weight:300}
.s1sb{font-size:28px;color:rgba(255,255,255,.25);text-align:center;max-width:650px;letter-spacing:1px}
.s2{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:0 60px}
.s2ar{font-size:36px;margin-bottom:10px;color:#3b82f6;opacity:.6}
.s2t{font-size:44px;font-weight:700;color:#fff;text-align:center;letter-spacing:1px}
.s2s{font-size:30px;color:rgba(255,255,255,.3);margin-top:10px;letter-spacing:2px}
</style>
</head>
<body>
<div id="root" data-composition-id="stat" data-start="0" data-width="1080" data-height="1920" data-duration="15">

<section class="clip" data-start="0" data-duration="10" data-track-index="1">
<div class="s1">
  <div class="s1h" id="e1">{{label}}</div>
  <div class="s1n" id="e2">{{stat}}</div>
  <div class="s1l" id="e3"></div>
  <div class="s1d" id="e4">{{desc}}</div>
  <div class="s1sb" id="e5">{{sub}}</div>
</div>
</section>

<section class="clip" data-start="10" data-duration="5" data-track-index="1">
<div class="s2">
  <div class="s2ar">→</div>
  <div class="s2t" id="s2t">{{follow}}</div>
  <div class="s2s" id="s2s">{{footer}}</div>
</div>
</section>

</div>

<script>
window.__timelines=window.__timelines||{}
var tl=gsap.timeline({paused:true})
tl.from('#e1',{y:-15,opacity:0,duration:.5,ease:'power2.out'},0)
tl.from('#e2',{scale:1.2,opacity:0,duration:.8,ease:'power3.out'},.3)
tl.from('#e3',{scaleX:0,transformOrigin:'center',opacity:0,duration:.6,ease:'power2.out'},.9)
tl.from('#e4',{y:20,opacity:0,duration:.6,ease:'power2.out'},1.2)
tl.from('#e5',{y:15,opacity:0,duration:.5,ease:'power2.out'},1.6)
tl.from('#s2t',{y:25,opacity:0,duration:.7,ease:'power2.out'},10.2)
tl.from('#s2s',{opacity:0,duration:.5,ease:'power2.out'},10.7)
window.__timelines['stat']=tl
</script>
</body>
</html>
