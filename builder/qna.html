<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<script src="gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
body{font-family:'Satoshi',system-ui,sans-serif;background:#faf8f5;color:#1a1a1a}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#faf8f5}
.clip{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:24px;box-shadow:0 8px 40px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.02);padding:50px 70px;width:100%;height:100%;display:flex;flex-direction:column}
:root{--accent:#6a8a8a}
.intro-card{align-items:center;justify-content:center}
.intro-line{width:40px;height:2px;background:var(--accent);border-radius:2px;margin:2px 0}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px}
.brand-icon{width:72px;height:72px;border-radius:18px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:#fff;margin-bottom:4px}
.intro-title{font-size:54px;font-weight:800;line-height:1.18;letter-spacing:-2px;color:#1a1a1a;text-align:center;max-width:700px;margin-top:6px}
.intro-desc{color:#b0b0b0;max-width:560px;margin-top:6px}
.detail-card{padding:40px 60px;justify-content:center}
.title{font-size:40px;font-weight:800;line-height:1.25;letter-spacing:-1px;color:var(--accent);margin-bottom:16px}
.visual-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;min-height:0}
.desc{font-size:24px;color:#c0c0c0;line-height:1.4;margin-top:16px}
.chat-wrap{display:flex;flex-direction:column;gap:14px;width:100%;max-width:700px}
.q-bubble{align-self:flex-end;background:var(--accent);color:#fff;border-radius:18px 18px 6px 18px;padding:16px 24px;font-size:30px;line-height:1.45;max-width:80%}
.a-bubble{align-self:flex-start;background:#faf8f5;color:#1a1a1a;border-radius:18px 18px 18px 6px;padding:16px 24px;font-size:30px;line-height:1.45;max-width:80%}
.cta-card{align-items:center;justify-content:center}
.cta-icon{width:56px;height:56px;border-radius:14px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fff;margin-bottom:6px}
.cta-name{font-size:48px;font-weight:800;letter-spacing:-1px;color:#1a1a1a;line-height:1}
.cta-name em{font-style:normal;color:var(--accent)}
.cta-line{width:40px;height:3px;background:var(--accent);border-radius:2px;margin:14px 0}
.cta-text{font-size:36px;font-weight:700;color:#1a1a1a;text-align:center;max-width:600px}
.cta-tag{font-size:18px;color:#ccc;letter-spacing:2px;text-transform:uppercase;margin-top:12px}
</style>
</head>
<body>
<div id="root" data-composition-id="qna" data-start="0" data-width="1080" data-height="1920" data-duration="12">
<section class="clip" data-start="0" data-duration="3" data-track-index="1">
  <div class="card intro-card">
    <div class="brand">
      <div class="brand-icon" id="bi">1s</div>
      <div class="intro-line" id="il"></div>
      <div class="intro-title" id="bt">{{title}}</div>
      <div class="intro-desc" id="bd">{{description}}</div>
    </div>
  </div>
</section>
<section class="clip" data-start="3" data-duration="6" data-track-index="1">
  <div class="card detail-card">
    <div class="visual-area">
      <div class="title" id="ot">{{title}}</div>
      <div class="chat-wrap">
        <div class="q-bubble" id="o1">{{question}}</div>
        <div class="a-bubble" id="o2">{{answer}}</div>
      </div>
      <div class="desc" id="o3">{{description}}</div>
    </div>
  </div>
</section>
<section class="clip" data-start="9" data-duration="3" data-track-index="1">
  <div class="card cta-card">
    <div class="brand">
      <div class="cta-icon" id="ci">1s</div>
      <div class="cta-name" id="cn"><em>1</em>section</div>
      <div class="cta-line" id="cl"></div>
      <div class="cta-text" id="ct">{{follow}}</div>
      <div class="cta-tag" id="cg">{{footer}}</div>
    </div>
  </div>
</section>
</div>
<script>
window.__timelines=window.__timelines||{}
var tl=gsap.timeline({paused:true,defaults:{ease:'power3.out'}})
tl.fromTo('#bi',{scale:.5,opacity:0,rotation:-10},{scale:1,opacity:1,rotation:0,duration:.4,ease:'back.out(1.5)'},0)
tl.fromTo('#bd',{y:18,opacity:0},{y:0,opacity:1,duration:.45},0)
tl.fromTo('#il',{scaleX:0},{scaleX:1,transformOrigin:'50% 0%',duration:.3},.15)
tl.fromTo('#bt',{scale:.94},{scale:1,letterSpacing:'-1.5',color:'var(--accent)',duration:.55,ease:'power2.out'},0)
tl.to('#bi,#il,#bt,#bd',{opacity:0,y:-18,duration:.35,stagger:.04,ease:'power3.in'},2.3)
tl.fromTo('#ot',{y:20,opacity:0},{y:0,opacity:1,duration:.45},3.45)
tl.fromTo('#o1',{x:50,opacity:0},{x:0,opacity:1,duration:.45},3.7)
tl.fromTo('#o2',{x:-50,opacity:0},{x:0,opacity:1,duration:.45},4.0)
tl.fromTo('#o3',{y:15,opacity:0},{y:0,opacity:1,duration:.3},4.3)
tl.fromTo('#ci',{scale:.5,opacity:0},{scale:1,opacity:1,duration:.4,ease:'back.out(1.4)'},9)
tl.fromTo('#cn',{y:15,opacity:0},{y:0,opacity:1,duration:.4},9.2)
tl.fromTo('#cl',{scaleX:0},{scaleX:1,transformOrigin:'50% 0%',duration:.3},9.4)
tl.fromTo('#ct',{y:20,opacity:0},{y:0,opacity:1,duration:.45},9.6)
tl.fromTo('#cg',{opacity:0},{opacity:1,duration:.3},9.85)
tl.to('#ci,#cn,#cl,#ct,#cg',{opacity:0,y:-15,duration:.3,stagger:.03,ease:'power3.in'},11.4)
window.__timelines['qna']=tl
</script>
</body>
</html>
