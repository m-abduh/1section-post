<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<script src="gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#fff;font-family:'NS',system-ui,sans-serif;font-size:40px}
@font-face{font-family:'NS';src:url('../fonts/NotoSans-Regular-Complete.ttf')format('truetype');font-weight:400}
@font-face{font-family:'NS';src:url('../fonts/NotoSans-Bold-Complete.ttf')format('truetype');font-weight:700}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#050505}
.clip{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.s1{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:50px 80px;overflow-y:auto;gap:20px}
.s1h{font-size:34px;color:rgba(6,182,212,.4);letter-spacing:6px;text-transform:uppercase;font-weight:400;margin-bottom:2px}
.s1c{display:flex;flex-direction:column;align-items:center;width:100%;max-width:660px;gap:20px;margin:4px 0}
.qb{background:linear-gradient(135deg,rgba(6,182,212,.1),rgba(6,182,212,.03));border:1px solid rgba(6,182,212,.2);border-radius:16px 16px 4px 16px;padding:14px 20px;font-size:34px;color:#e8f5fe;line-height:1.35;align-self:flex-end;max-width:78%;font-weight:300}
.qbd{display:flex;align-items:center;gap:20px;margin:2px 0 8px;align-self:center}
.qbd span{width:28px;height:1px;background:rgba(255,255,255,.06)}
.qbd div{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.1)}
.ab{display:flex;align-items:flex-start;gap:20px;align-self:flex-start;background:linear-gradient(135deg,rgba(6,182,212,.04),transparent);border-radius:12px;padding:12px 16px;max-width:85%}
.abg{width:28px;height:28px;min-width:28px;border-radius:50%;background:linear-gradient(135deg,rgba(6,182,212,.15),rgba(6,182,212,.05));border:1px solid rgba(6,182,212,.3);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#06b6d4}
.at{font-size:32px;color:rgba(255,255,255,.75);line-height:1.35;padding-top:2px;flex:1;font-weight:300}
.s1d{font-size:28px;color:rgba(255,255,255,.25);text-align:center;max-width:660px;font-weight:300}
.s2{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:0 60px}
.s2t{font-size:44px;font-weight:700;color:#fff;text-align:center;letter-spacing:1px}
.s2s{font-size:30px;color:rgba(255,255,255,.3);margin-top:10px;letter-spacing:2px}
</style>
</head>
<body>
<div id="root" data-composition-id="qna" data-start="0" data-width="1080" data-height="1920" data-duration="15">

<section class="clip" data-start="0" data-duration="10" data-track-index="1">
<div class="s1">
  <div class="s1h" id="s1h">{{title}}</div>
  <div class="s1c">
    <div class="qb" id="qb">{{question}}</div>
    <div class="qbd" id="qd"><span></span><div></div><span></span></div>
    <div class="ab" id="ab">
      <div class="abg">A</div>
      <div class="at" id="at">{{answer}}</div>
    </div>
  </div>
  <div class="s1d" id="sd"></div>
</div>
</section>

<section class="clip" data-start="10" data-duration="5" data-track-index="1">
<div class="s2">
  <div class="s2t" id="s2t">{{follow}}</div>
  <div class="s2s" id="s2s">{{footer}}</div>
</div>
</section>

</div>

<script>
window.__timelines=window.__timelines||{}
var tl=gsap.timeline({paused:true})
tl.from('#s1h',{y:-15,opacity:0,duration:.5,ease:'power2.out'},0)
tl.from('#qb',{x:50,opacity:0,duration:.55,ease:'power2.out'},.3)
tl.from('#qd',{opacity:0,duration:.3},.7)
tl.from('#ab',{x:-50,opacity:0,duration:.55,ease:'power2.out'},.85)
tl.from('#sd',{y:10,opacity:0,duration:.4,ease:'power2.out'},1.3)
tl.from('#s2t',{y:25,opacity:0,duration:.7,ease:'power2.out'},10.2)
tl.from('#s2s',{opacity:0,duration:.5,ease:'power2.out'},10.7)
window.__timelines['qna']=tl
</script>
</body>
</html>
