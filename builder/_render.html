<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<script src="gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:'Satoshi';src:url('../fonts/Satoshi-Variable.ttf')format('truetype');font-weight:300 900}
body{font-family:'Satoshi',system-ui,sans-serif;background:#faf8f5;color:#1a1a1a}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#faf8f5}
.clip{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:24px;box-shadow:0 8px 40px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.02);padding:50px 70px;width:100%;height:100%;display:flex;flex-direction:column}
:root{--accent:#d4745d}
.eyebrow-row{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.eyebrow-accent{font-size:26px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--accent)}
.eyebrow-line{flex:1;height:2px;background:rgba(0,0,0,.06)}
.title{font-size:44px;font-weight:800;line-height:1.25;letter-spacing:-1px;color:var(--accent);margin-bottom:36px}
.visual-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.content-area{margin-top:20px}
.desc{font-size:26px;color:#c0c0c0;line-height:1.4}
.stat-wrap{display:flex;align-items:center;gap:40px;max-width:760px}
.stat-big{display:flex;align-items:baseline;gap:4px;flex-shrink:0}
.stat-num{font-size:130px;font-weight:800;line-height:1;color:var(--accent);letter-spacing:-4px}
.stat-pct{font-size:52px;font-weight:700;color:var(--accent);opacity:.5}
.stat-body{font-size:36px;line-height:1.5;color:#1a1a1a;font-weight:400}
.hook-sec{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#faf8f5}
.hook-title{font-size:64px;font-weight:800;color:var(--accent);text-align:center;line-height:1.2;max-width:800px;padding:40px}
.s2{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:0 60px;background:#fff}
.s2t{font-size:44px;font-weight:800;color:#1a1a1a;text-align:center}
.s2s{font-size:26px;color:#c0c0c0;margin-top:12px}
</style>
</head>
<body>
<div id="root" data-composition-id="stat" data-start="0" data-width="1080" data-height="1920" data-duration="15">
<section class="clip" data-start="0" data-duration="4" data-track-index="1">
  <div class="hook-sec">
    <div class="hook-title" id="ht">The data is undeniable<audio id="bgm" src="/home/mabduh/projects/marketing/marketing/music/Epic Spectrum - Ethos (freetouse.com).mp3" data-start="0" data-duration="15" data-volume="0.3" data-has-audio="true"></audio>
</div>
  </div>
</section>
<section class="clip" data-start="4" data-duration="6" data-track-index="1">
  <div class="card">
    <div class="eyebrow-row">
      <span class="eyebrow-accent">THE STAT</span>
      <div class="eyebrow-line"></div>
    </div>
    <div class="visual-area">
      <div class="title" style="margin-bottom:36px">The data is undeniable</div>
      <div class="stat-wrap">
        <div class="stat-big">
          <span class="stat-num" id="e1">87%</span>
        </div>
        <div class="stat-body" id="e2">Of people prefer the better option</div>
      </div>
    </div>
    <div class="content-area">
      <div class="desc" id="e3">Data shows a clear upward trend</div>
    </div>
  </div>
</section>
<section class="clip" data-start="10" data-duration="5" data-track-index="1">
<div class="s2">
  <div class="s2t" id="s2t">Follow @1section</div>
  <div class="s2s" id="s2s">1section.com</div>
</div>
</section>
</div>
<script>
window.__timelines=window.__timelines||{}
var tl=gsap.timeline({paused:true,defaults:{ease:'power3.out'}})
tl.fromTo('#ht',{opacity:0,scale:1.3},{opacity:1,scale:1.3,duration:.5,ease:'power2.out'},0)
tl.to('#ht',{opacity:0,scale:1,duration:.5},3.5)
tl.fromTo('.eyebrow-row',{x:-30,opacity:0},{x:0,opacity:1,duration:.5},4)
tl.fromTo('.title',{y:24,opacity:0},{y:0,opacity:1,duration:.6},4.25)
tl.fromTo('#e1',{scale:1.25,opacity:0},{scale:1,opacity:1,duration:.8},4.55)
tl.fromTo('#e2',{y:30,opacity:0},{y:0,opacity:1,duration:.6},4.85)
tl.fromTo('#e3',{y:20,opacity:0},{y:0,opacity:1,duration:.5},5.25)
tl.fromTo('#s2t',{y:30,opacity:0},{y:0,opacity:1,duration:.65},10.2)
tl.fromTo('#s2s',{opacity:0},{opacity:1,duration:.5},10.65)
window.__timelines['stat']=tl
</script>
</body>
</html>
