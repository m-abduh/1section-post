<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080,height=1920">
<script src="gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#fff;font-family:'NS',system-ui,sans-serif;font-size:40px}
@font-face{font-family:'NS';src:url('../fonts/NotoSans-Regular-Complete.ttf')format('truetype');font-weight:400}
@font-face{font-family:'NS';src:url('../fonts/NotoSans-Bold-Complete.ttf')format('truetype');font-weight:700}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#050505}
.clip{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.s1{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:50px 80px;overflow-y:auto;gap:20px}
.s1h{font-size:34px;color:rgba(99,102,241,.4);letter-spacing:6px;text-transform:uppercase;font-weight:400;margin-bottom:2px}
.s1c{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%;max-width:620px;margin:6px 0}
.tc{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,.03),rgba(255,255,255,.01));border:1px solid rgba(255,255,255,.06);border-left:3px solid #6366f1;border-radius:12px;padding:14px 18px;width:100%}
.twn{position:absolute;right:10px;bottom:-8px;font-size:80px;font-weight:700;color:rgba(99,102,241,.04);line-height:1;pointer-events:none}
.tct{font-size:34px;font-weight:700;color:#f0f0f0;position:relative;z-index:1;letter-spacing:.5px}
.tcd{font-size:28px;color:rgba(255,255,255,.4);margin-top:3px;position:relative;z-index:1;font-weight:300}
.s1d{font-size:28px;color:#a5b4fc;text-align:center;max-width:660px;font-weight:300;letter-spacing:1px}
.s2{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:0 60px}
.s2t{font-size:44px;font-weight:700;color:#fff;text-align:center;letter-spacing:1px}
.s2s{font-size:30px;color:rgba(255,255,255,.3);margin-top:10px;letter-spacing:2px}
</style>
</head>
<body>
<div id="root" data-composition-id="tips" data-start="0" data-width="1080" data-height="1920" data-duration="15">

<section class="clip" data-start="0" data-duration="10" data-track-index="1">
<div class="s1">
  <div class="s1h" id="s1h">FOCUS BETTER<audio id="bgm" src="/home/mabduh/projects/marketing/marketing/music/Epic Spectrum - Ascend (freetouse.com).mp3" data-start="0" data-duration="15" data-volume="0.3" data-has-audio="true"></audio>
</div>
  <div class="s1c">

<div class="tc">
  <div class="twn">1</div>
  <div class="tct">Single-task mode</div>
  <div class="tcd">One focus block at a time. No multitasking allowed.</div>
</div>

<div class="tc">
  <div class="twn">2</div>
  <div class="tct">Time boxing</div>
  <div class="tcd">Set a timer. Work only until it rings. Then rest.</div>
</div>

<div class="tc">
  <div class="twn">3</div>
  <div class="tct">Environment design</div>
  <div class="tcd">Remove distractions before they remove your focus.</div>
</div>

  </div>
  <div class="s1d" id="sd">Simple productivity hacks</div>
</div>
</section>

<section class="clip" data-start="10" data-duration="5" data-track-index="1">
<div class="s2">
  <div class="s2t" id="s2t">Follow @1section</div>
  <div class="s2s" id="s2s">1section.com</div>
</div>
</section>

</div>

<script>
window.__timelines=window.__timelines||{}
var tl=gsap.timeline({paused:true})
tl.from('#s1h',{y:-15,opacity:0,duration:.5,ease:'power2.out'},0)
var nt=document.querySelectorAll('.tc').length
tl.from('.tc',{y:20,opacity:0,stagger:.1,duration:.45,ease:'power2.out'},.35)
tl.from('.twn',{opacity:0,stagger:.1,duration:.35},.35)
tl.from('#sd',{y:10,opacity:0,duration:.4,ease:'power2.out'},.35+nt*.1+.05)
tl.from('#s2t',{y:25,opacity:0,duration:.7,ease:'power2.out'},10.2)
tl.from('#s2s',{opacity:0,duration:.5,ease:'power2.out'},10.7)
window.__timelines['tips']=tl
</script>
</body>
</html>
